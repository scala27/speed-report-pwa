<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新年度預算編列 - 經濟部水利署</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#268785">

  <style>
    :root {
      --primary-teal: #268785;
      --primary-dark: #1d6a69;
      --primary-light: #e6f3f3;
      --bg-gradient: linear-gradient(180deg, #e4f2f2 0%, #f8fafc 220px);
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-card: 16px;
      --radius-input: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 12px 12px 120px 12px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* Header 卡片 */
    .hero-header-card {
      background: linear-gradient(135deg, #1d6a69 0%, #268785 60%, #42aba8 100%);
      border-radius: var(--radius-card);
      padding: 20px;
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 10px 22px -5px rgba(38, 135, 133, 0.35);
    }

    .header-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .agency-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-back-portal {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    .hero-main-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .hero-sub-title {
      font-size: 0.82rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    /* 審議階段頁籤切換條 */
    .stage-tabs-container {
      background: #ffffff;
      border-radius: var(--radius-card);
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .stage-tab-btn {
      padding: 10px 2px;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .stage-tab-btn.active {
      background: var(--primary-teal);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(38, 135, 133, 0.3);
    }

    /* KPI 核心數據面板 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .kpi-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .kpi-value {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--primary-teal);
    }

    .kpi-sub {
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .text-up { color: #dc2626; }
    .text-down { color: #16a34a; }
    .text-same { color: #64748b; }

    /* 階層樹狀展示卡片 */
    .tree-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .tree-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 階層 1：主管部會 */
    .node-level-1 {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .node-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node-title-l1 {
      font-weight: 800;
      font-size: 0.95rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-amount-l1 {
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary-teal);
    }

    /* 階層 2：預算類別 (公務 / 基金) */
    .node-level-2 {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 3px solid #cbd5e1;
    }

    .node-box-l2 {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .node-title-l2 {
      font-weight: 700;
      font-size: 0.88rem;
      color: #334155;
    }

    .node-amount-l2 {
      font-weight: 800;
      font-size: 0.9rem;
      color: #1d6a69;
    }

    /* 階層 3：門別 (經常 / 資本 / 補助) */
    .node-level-3 {
      margin-top: 6px;
      padding-left: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .node-box-l3 {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    .node-title-l3 {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .node-amount-l3 {
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2px;
    }

    /* 底部固定操作列 */
    .sticky-actions-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e2e8f0;
      padding: 10px 8px;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    }

    .actions-container {
      max-width: 650px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr 1.1fr;
      gap: 5px;
    }

    .btn-action {
      padding: 10px 2px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-action-hero {
      background: linear-gradient(135deg, #1d6a69 0%, #268785 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(38, 135, 133, 0.35);
    }

    /* Modal 對話框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
    }

    .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
    .btn-close-modal { font-size: 1.2rem; background: none; border: none; cursor: pointer; color: var(--text-muted); }

    .form-group-modal { margin-bottom: 10px; }
    .form-group-modal label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: #334155; }

    .input-modal {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.88rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    .input-modal:focus { border-color: var(--primary-teal); }

    .section-box-modal {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .section-title-modal {
      font-size: 0.82rem;
      font-weight: 800;
      color: #1d6a69;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    #status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      font-weight: 700;
    }
    .status-info { background: #e6f3f3; color: #165857; }
    .status-success { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header 卡片 -->
  <div class="hero-header-card">
    <div class="header-top-nav">
      <div class="agency-tag">🏛️ 經濟部水利署</div>
      <a href="./index.html" class="btn-back-portal">🏠 返回工作區</a>
    </div>
    <div class="hero-main-title">中央管流域整體改善與調適計畫(116-121年)</div>
    <div class="hero-sub-title">116年度預算籌編與審議追蹤</div>
  </div>

  <!-- 四大審議階段切換頁籤 -->
  <div class="stage-tabs-container">
    <button class="stage-tab-btn active" data-stage="1">1. 概算階段</button>
    <button class="stage-tab-btn" data-stage="2">2. 國發會審議</button>
    <button class="stage-tab-btn" data-stage="3">3. 行政院預算案</button>
    <button class="stage-tab-btn" data-stage="4">4. 法定預算</button>
  </div>

  <!-- KPI 核心數據面板 -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">116年跨部會總計</div>
      <div class="kpi-value" id="kpiGrandTotal">0 億元</div>
      <div class="kpi-sub text-same" id="kpiDiffText">當前：概算階段</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">水利署經費小計</div>
      <div class="kpi-value" id="kpiWraTotal">0 億元</div>
      <div class="kpi-sub" style="color:var(--text-muted);" id="kpiWraGovSub">公務: 0億 | 基金: 0億</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">農業部與環境部</div>
      <div class="kpi-value" id="kpiOtherDepts">0 億元</div>
      <div class="kpi-sub" style="color:var(--text-muted);" id="kpiOtherSub">農: 0億 | 環: 0億</div>
    </div>
  </div>

  <div id="status-msg"></div>

  <!-- 階層樹狀卡片展示區 -->
  <div class="tree-card">
    <div class="tree-header">
      <span>📌 116年度經費結構明細</span>
      <span style="font-size:0.8rem; font-weight:700; color:var(--primary-teal);" id="currentStageBadge">概算階段</span>
    </div>

    <!-- 第一層：經濟部水利署 -->
    <div class="node-level-1">
      <div class="node-row">
        <div class="node-title-l1">🏢 經濟部水利署</div>
        <div class="node-amount-l1" id="disp_wra_total">0 億元</div>
      </div>

      <!-- 第二層：公務預算 (經常 + 資本 + 補助) -->
      <div class="node-level-2">
        <div class="node-box-l2">
          <div class="node-row">
            <div class="node-title-l2">📘 公務預算 (自動勾稽小計)</div>
            <div class="node-amount-l2" id="disp_wra_gov">0 億元</div>
          </div>
          <!-- 第三層：門別與用途 -->
          <div class="node-level-3">
            <div class="node-box-l3">
              <div class="node-title-l3">經常門</div>
              <div class="node-amount-l3" id="disp_wra_cur">0 元</div>
            </div>
            <div class="node-box-l3">
              <div class="node-title-l3">資本門</div>
              <div class="node-amount-l3" id="disp_wra_cap">0 元</div>
            </div>
            <div class="node-box-l3">
              <div class="node-title-l3">補助款</div>
              <div class="node-amount-l3" id="disp_wra_sub">0 元</div>
            </div>
          </div>
        </div>

        <!-- 第二層：水資源作業基金 -->
        <div class="node-box-l2">
          <div class="node-row">
            <div class="node-title-l2">📗 水資源作業基金</div>
            <div class="node-amount-l2" id="disp_wra_fund">0 億元</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 第一層：農業部 -->
    <div class="node-level-1">
      <div class="node-row">
        <div class="node-title-l1">🌾 農業部</div>
        <div class="node-amount-l1" id="disp_moa">0 億元</div>
      </div>
    </div>

    <!-- 第一層：環境部 -->
    <div class="node-level-1">
      <div class="node-row">
        <div class="node-title-l1">🍃 環境部</div>
        <div class="node-amount-l1" id="disp_moe">0 億元</div>
      </div>
    </div>
  </div>
</div>

<!-- 底部操作列 -->
<div class="sticky-actions-bar">
  <div class="actions-container">
    <button type="button" class="btn-action btn-action-hero" id="btnEditCurrentStage">✏️ 填寫/修正數據</button>
    <button type="button" class="btn-action" id="btnCopySummary">📋 複製長官摘要</button>
    <button type="button" class="btn-action" id="btnExportExcel">📊 匯出 Excel</button>
    <button type="button" class="btn-action" id="btnTransferToFormal" style="background:#fef3c7; color:#92400e; border-color:#fcd34d;">🚀 轉入法定庫</button>
  </div>
</div>

<!-- Modal 1: 填寫 / 修正數據對話框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalStageTitle">編輯 116 年度經費數據</div>
      <button class="btn-close-modal" id="btnCloseModal">✕</button>
    </div>

    <!-- 水利署填寫區 -->
    <div class="section-box-modal">
      <div class="section-title-modal">
        <span>🏢 經濟部水利署</span>
        <span id="modal_wra_gov_calc" style="color:#0f172a;">公務小計: 0 千元</span>
      </div>

      <div class="form-group-modal">
        <label>經常門 (單位：千元)</label>
        <input type="number" id="input_wra_cur" class="input-modal calc-trigger" value="0">
      </div>
      <div class="form-group-modal">
        <label>資本門 (單位：千元)</label>
        <input type="number" id="input_wra_cap" class="input-modal calc-trigger" value="0">
      </div>
      <div class="form-group-modal">
        <label>補助款 (單位：千元)</label>
        <input type="number" id="input_wra_sub" class="input-modal calc-trigger" value="0">
      </div>
      <div class="form-group-modal" style="margin-top:8px; border-top:1px dashed #cbd5e1; padding-top:8px;">
        <label>水資源作業基金 (單位：千元)</label>
        <input type="number" id="input_wra_fund" class="input-modal" value="0">
      </div>
    </div>

    <!-- 農業部填寫區 -->
    <div class="section-box-modal">
      <div class="section-title-modal">🌾 農業部</div>
      <div class="form-group-modal">
        <label>經費額度 (單位：千元)</label>
        <input type="number" id="input_moa" class="input-modal" value="0">
      </div>
    </div>

    <!-- 環境部填寫區 -->
    <div class="section-box-modal">
      <div class="section-title-modal">🍃 環境部</div>
      <div class="form-group-modal">
        <label>經費額度 (單位：千元)</label>
        <input type="number" id="input_moe" class="input-modal" value="0">
      </div>
    </div>

    <button type="button" class="btn-action btn-action-hero" id="btnSaveStageData" style="width:100%; padding:11px;">💾 儲存並更新此階段數值</button>
  </div>
</div>

<script>
  // 核心資料結構：紀錄 116 年度四個審議階段 (額度單位：千元)
  const defaultDraftData = {
    planName: "中央管流域整體改善與調適計畫(116-121年)",
    targetYear: "116",
    stages: {
      "1": { wra_cur: 1200000, wra_cap: 15500000, wra_sub: 2500000, wra_fund: 6800000, moa: 3200000, moe: 850000 },
      "2": { wra_cur: 1150000, wra_cap: 15000000, wra_sub: 2400000, wra_fund: 6500000, moa: 3000000, moe: 800000 },
      "3": { wra_cur: 1180000, wra_cap: 15500000, wra_sub: 2450000, wra_fund: 6600000, moa: 3100000, moe: 820000 },
      "4": { wra_cur: 0, wra_cap: 0, wra_sub: 0, wra_fund: 0, moa: 0, moe: 0 }
    }
  };

  const STAGE_NAMES = {
    "1": "概算階段",
    "2": "國發會審議",
    "3": "行政院預算案",
    "4": "法定預算"
  };

  let appState = {
    data: null,
    currentStage: "1"
  };

  document.addEventListener('DOMContentLoaded', () => {
    loadAppState();
    initUIEvents();
    renderApp();
  });

  function loadAppState() {
    const saved = localStorage.getItem('wra_draft_budget_single_v1');
    if (saved) {
      try {
        appState.data = JSON.parse(saved);
      } catch (e) {
        appState.data = JSON.parse(JSON.stringify(defaultDraftData));
      }
    } else {
      appState.data = JSON.parse(JSON.stringify(defaultDraftData));
    }
  }

  function saveAppState() {
    localStorage.setItem('wra_draft_budget_single_v1', JSON.stringify(appState.data));
  }

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
    setTimeout(() => { msgEl.style.display = 'none'; }, 4000);
  }

  function formatMoneyText(valThousand) {
    if (!valThousand || valThousand === 0) return '0 元';
    const valNTD = valThousand * 1000;
    if (Math.abs(valNTD) >= 100000000) {
      return `${(valNTD / 100000000).toFixed(2)} 億元`;
    } else if (Math.abs(valNTD) >= 10000) {
      return `${(valNTD / 10000).toFixed(0)} 萬元`;
    }
    return `${valThousand.toLocaleString()} 千元`;
  }

  function initUIEvents() {
    // 審議階段切換
    document.querySelectorAll('.stage-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stage-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        appState.currentStage = btn.getAttribute('data-stage');
        renderApp();
      });
    });

    document.getElementById('btnEditCurrentStage').addEventListener('click', openModalForCurrentStage);
    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('editModal').style.display = 'none';
    });

    // Modal 計算加總監聽
    document.querySelectorAll('.calc-trigger').forEach(input => {
      input.addEventListener('input', updateModalCalcSummary);
    });

    document.getElementById('btnSaveStageData').addEventListener('click', saveModalStageData);
    document.getElementById('btnCopySummary').addEventListener('click', copyExecutiveSummary);
    document.getElementById('btnExportExcel').addEventListener('click', exportExcelReport);
    document.getElementById('btnTransferToFormal').addEventListener('click', transferToFormalBudgetApp);
  }

  function renderApp() {
    const stData = appState.data.stages[appState.currentStage] || { wra_cur:0, wra_cap:0, wra_sub:0, wra_fund:0, moa:0, moe:0 };

    // 勾稽加總計算
    const wraGov = (stData.wra_cur || 0) + (stData.wra_cap || 0) + (stData.wra_sub || 0);
    const wraTotal = wraGov + (stData.wra_fund || 0);
    const otherTotal = (stData.moa || 0) + (stData.moe || 0);
    const grandTotal = wraTotal + otherTotal;

    // 更新 UI 數據顯示
    document.getElementById('currentStageBadge').innerText = STAGE_NAMES[appState.currentStage];
    document.getElementById('kpiGrandTotal').innerText = formatMoneyText(grandTotal);
    document.getElementById('kpiDiffText').innerText = `當前：${STAGE_NAMES[appState.currentStage]}`;

    document.getElementById('kpiWraTotal').innerText = formatMoneyText(wraTotal);
    document.getElementById('kpiWraGovSub').innerText = `公務: ${formatMoneyText(wraGov)} | 基金: ${formatMoneyText(stData.wra_fund)}`;

    document.getElementById('kpiOtherDepts').innerText = formatMoneyText(otherTotal);
    document.getElementById('kpiOtherSub').innerText = `農: ${formatMoneyText(stData.moa)} | 環: ${formatMoneyText(stData.moe)}`;

    // 樹狀節點渲染
    document.getElementById('disp_wra_total').innerText = formatMoneyText(wraTotal);
    document.getElementById('disp_wra_gov').innerText = formatMoneyText(wraGov);
    document.getElementById('disp_wra_cur').innerText = formatMoneyText(stData.wra_cur);
    document.getElementById('disp_wra_cap').innerText = formatMoneyText(stData.wra_cap);
    document.getElementById('disp_wra_sub').innerText = formatMoneyText(stData.wra_sub);
    document.getElementById('disp_wra_fund').innerText = formatMoneyText(stData.wra_fund);

    document.getElementById('disp_moa').innerText = formatMoneyText(stData.moa);
    document.getElementById('disp_moe').innerText = formatMoneyText(stData.moe);
  }

  function openModalForCurrentStage() {
    const stageName = STAGE_NAMES[appState.currentStage];
    document.getElementById('modalStageTitle').innerText = `填寫 116 年度【${stageName}】經費數`;

    const stData = appState.data.stages[appState.currentStage] || { wra_cur:0, wra_cap:0, wra_sub:0, wra_fund:0, moa:0, moe:0 };

    document.getElementById('input_wra_cur').value = stData.wra_cur || 0;
    document.getElementById('input_wra_cap').value = stData.wra_cap || 0;
    document.getElementById('input_wra_sub').value = stData.wra_sub || 0;
    document.getElementById('input_wra_fund').value = stData.wra_fund || 0;
    document.getElementById('input_moa').value = stData.moa || 0;
    document.getElementById('input_moe').value = stData.moe || 0;

    updateModalCalcSummary();
    document.getElementById('editModal').style.display = 'flex';
  }

  function updateModalCalcSummary() {
    const cur = parseInt(document.getElementById('input_wra_cur').value) || 0;
    const cap = parseInt(document.getElementById('input_wra_cap').value) || 0;
    const sub = parseInt(document.getElementById('input_wra_sub').value) || 0;
    const govTotal = cur + cap + sub;

    document.getElementById('modal_wra_gov_calc').innerText = `公務小計: ${govTotal.toLocaleString()} 千元 (${formatMoneyText(govTotal)})`;
  }

  function saveModalStageData() {
    const cur = parseInt(document.getElementById('input_wra_cur').value) || 0;
    const cap = parseInt(document.getElementById('input_wra_cap').value) || 0;
    const sub = parseInt(document.getElementById('input_wra_sub').value) || 0;
    const fund = parseInt(document.getElementById('input_wra_fund').value) || 0;
    const moa = parseInt(document.getElementById('input_moa').value) || 0;
    const moe = parseInt(document.getElementById('input_moe').value) || 0;

    appState.data.stages[appState.currentStage] = {
      wra_cur: cur,
      wra_cap: cap,
      wra_sub: sub,
      wra_fund: fund,
      moa: moa,
      moe: moe
    };

    saveAppState();
    document.getElementById('editModal').style.display = 'none';
    renderApp();
    showStatus(`已更新【${STAGE_NAMES[appState.currentStage]}】經費數！`, 'success');
  }

  // 複製長官速報摘要
  function copyExecutiveSummary() {
    const stageName = STAGE_NAMES[appState.currentStage];
    const stData = appState.data.stages[appState.currentStage] || { wra_cur:0, wra_cap:0, wra_sub:0, wra_fund:0, moa:0, moe:0 };

    const wraGov = stData.wra_cur + stData.wra_cap + stData.wra_sub;
    const wraTotal = wraGov + stData.wra_fund;
    const grandTotal = wraTotal + stData.moa + stData.moe;

    const summaryText = `【${appState.data.planName}】\n` +
      `116年度籌編金額速報（${stageName}）：\n` +
      `1. 水利署公務預算：共 ${formatMoneyText(wraGov)}（經常門 ${formatMoneyText(stData.wra_cur)}、資本門 ${formatMoneyText(stData.wra_cap)}、補助款 ${formatMoneyText(stData.wra_sub)}）。\n` +
      `2. 水利署水資源基金：${formatMoneyText(stData.wra_fund)}，水利署經費合計 ${formatMoneyText(wraTotal)}。\n` +
      `3. 跨部會預算：農業部 ${formatMoneyText(stData.moa)}、環境部 ${formatMoneyText(stData.moe)}。\n` +
      `全案116年度籌編總金額為 ${formatMoneyText(grandTotal)}。`;

    navigator.clipboard.writeText(summaryText).then(() => {
      showStatus('已複製長官簡報摘要至剪貼簿！', 'success');
    }).catch(err => {
      prompt('請手動複製摘要文字：', summaryText);
    });
  }

  // 匯出 Excel
  function exportExcelReport() {
    let csvContent = "\uFEFF";
    csvContent += `"審議階段","水利署經常門(千元)","水利署資本門(千元)","水利署補助款(千元)","水利署公務小計(千元)","水資源基金(千元)","水利署合計(千元)","農業部(千元)","環境部(千元)","116年總計(千元)"\n`;

    Object.keys(STAGE_NAMES).forEach(stKey => {
      const stData = appState.data.stages[stKey] || { wra_cur:0, wra_cap:0, wra_sub:0, wra_fund:0, moa:0, moe:0 };
      const gov = stData.wra_cur + stData.wra_cap + stData.wra_sub;
      const wraTot = gov + stData.wra_fund;
      const grand = wraTot + stData.moa + stData.moe;

      csvContent += `"${STAGE_NAMES[stKey]}",${stData.wra_cur},${stData.wra_cap},${stData.wra_sub},${gov},${stData.wra_fund},${wraTot},${stData.moa},${stData.moe},${grand}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `中央管流域整體改善與調適計畫_116年籌編表.csv`;
    link.click();
    showStatus('已成功匯出 Excel 統計表 (.csv)！', 'success');
  }

  // 轉入正式法定預算資料庫 (Bridge Action)
  function transferToFormalBudgetApp() {
    const stData = appState.data.stages["4"]; // 法定預算階段
    const wraGov = (stData.wra_cur || 0) + (stData.wra_cap || 0) + (stData.wra_sub || 0);

    if (wraGov === 0 && stData.wra_fund === 0) {
      alert('目前「4. 法定預算」階段尚無填寫數據（皆為 0 元），請於立法院三讀通過確定後，進入第 4 階段輸入數據再執行轉入！');
      return;
    }

    if (!confirm(`確定要將 116 年度【法定預算】公務預算 (${formatMoneyText(wraGov)}) 轉入正式計畫資料庫嗎？`)) {
      return;
    }

    let formalData = null;
    const savedFormal = localStorage.getItem('wra_budget_app_data_v4');
    if (savedFormal) {
      try { formalData = JSON.parse(savedFormal); } catch(e){}
    }

    if (!formalData) {
      alert('找不到正式預算資料庫，請先開啟「計畫年度預算統計資訊」頁面建置！');
      return;
    }

    // 1. 確保 116 年存在於年份清單
    if (!formalData.years.includes('116')) {
      formalData.years.push('116');
      formalData.years.sort((a,b) => parseInt(a)-parseInt(b));
    }

    // 2. 寫入/更新至正式計畫列表
    const pName = "中央管流域整體改善與調適計畫(116-121年)";
    let existP = formalData.projects.find(p => p.name.includes("中央管流域"));

    if (existP) {
      existP.name = pName;
      existP.startYear = "116";
      existP.endYear = "121";
      existP.budgets["116"] = wraGov;
    } else {
      formalData.projects.unshift({
        id: `p_116_main`,
        name: pName,
        category: "公務預算",
        startYear: "116",
        endYear: "121",
        budgets: { "116": wraGov }
      });
    }

    localStorage.setItem('wra_budget_app_data_v4', JSON.stringify(formalData));
    showStatus('🎉 已成功將 116 年法定預算數據寫入並更新至正式計畫資料庫！', 'success');
  }
</script>
