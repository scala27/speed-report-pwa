<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>計畫年度預算速查 - 經濟部水利署</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b81ad">

  <style>
    :root {
      --primary-water: rgb(88, 178, 220);
      --primary-dark: #2b81ad;
      --primary-light: #eef7fc;
      --bg-gradient: linear-gradient(180deg, #eaf5fb 0%, #f8fafc 220px);
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-card: 16px;
      --radius-input: 10px;
      --badge-gov: #dbeafe;
      --badge-gov-text: #1e40af;
      --badge-spec: #fef3c7;
      --badge-spec-text: #92400e;
      --badge-total: #e0e7ff;
      --badge-total-text: #3730a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 12px 12px 120px 12px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* Header 卡片 */
    .hero-header-card {
      background: linear-gradient(135deg, #2b81ad 0%, rgb(88, 178, 220) 60%, #7ac6e9 100%);
      border-radius: var(--radius-card);
      padding: 20px;
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 10px 22px -5px rgba(88, 178, 220, 0.35);
      position: relative;
      overflow: hidden;
    }

    .header-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .agency-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-back-portal {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    .btn-back-portal:active { background: rgba(0, 0, 0, 0.3); }

    .hero-main-title {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* KPI 核心數據面板 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .kpi-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .kpi-value {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    /* 控制與搜尋列 */
    .control-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-input);
      margin-bottom: 10px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary-water); }

    .chip-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    .chip-btn {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    /* 年份範圍選擇 */
    .year-range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
    }

    .select-year {
      padding: 4px 8px;
      font-size: 0.82rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }

    /* 計畫卡片列表 */
    .project-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--primary-water);
      border-radius: var(--radius-card);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .project-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .project-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .category-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-gov { background: var(--badge-gov); color: var(--badge-gov-text); }
    .badge-spec { background: var(--badge-spec); color: var(--badge-spec-text); }
    .badge-total { background: var(--badge-total); color: var(--badge-total-text); }

    .budget-summary-row {
      display: flex;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .summary-item-label { color: var(--text-muted); font-weight: 600; }
    .summary-item-val { font-weight: 800; color: var(--primary-dark); }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }

    .btn-outline { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline:active { background: #e2e8f0; }

    .btn-primary-sm { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-primary-sm:active { background: #bae6fd; }

    /* 歷年明細展開表 */
    .details-table-wrapper {
      margin-top: 10px;
      display: none;
      overflow-x: auto;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: right;
    }

    .details-table th, .details-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .details-table th {
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }

    /* 底部操作列 (擴充與備份工具) */
    .sticky-actions-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e2e8f0;
      padding: 10px 12px;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    }

    .actions-container {
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-action-hero {
      background: linear-gradient(135deg, #2b81ad 0%, rgb(88, 178, 220) 100%);
      color: #ffffff;
      border: none;
    }

    /* Modal 對話框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title { font-size: 1.1rem; font-weight: 800; }
    .btn-close-modal { font-size: 1.2rem; background: none; border: none; cursor: pointer; color: var(--text-muted); }

    .form-group-modal {
      margin-bottom: 12px;
    }

    .form-group-modal label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #334155;
    }

    .input-modal {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.88rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    .modal-budget-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      font-weight: 700;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>

<div class="app-container">
  <!-- Header 卡片 -->
  <div class="hero-header-card">
    <div class="header-top-nav">

    <div class="hero-main-title">計畫年度預算速查與管理</div>

      <div class="kpi-value" id="kpiLatestYear">109 年</div>

  </div>

  <!-- 搜尋與動態過濾 -->
  <div class="control-card">

    <div class="chip-group">
      <button class="chip-btn active" data-cat="ALL">全部類別</button>
      <button class="chip-btn" data-cat="公務預算">公務預算</button>
      <button class="chip-btn" data-cat="特別預算">特別預算</button>
      <button class="chip-btn" data-cat="分類總計">分類總計</button>
    </div>

    <div class="year-range-row">

        <select id="startYearSelect" class="select-year"></select>
        <span>至</span>
        <select id="endYearSelect" class="select-year"></select>
      </div>
    </div>
  </div>

  <div id="status-msg"></div>

  <!-- 計畫卡片列表區 -->
  <div id="projectListContainer"></div>
</div>

<!-- 底部操作與動態擴充列 -->
<div class="sticky-actions-bar">
  <div class="actions-container">
    <button type="button" class="btn-action btn-action-hero" id="btnAddYearBtn">➕ 新增年度</button>
    <button type="button" class="btn-action" id="btnAddProjectBtn">➕ 新增計畫</button>
    <button type="button" class="btn-action" id="btnExportJson">📥 匯出 JSON</button>
    <button type="button" class="btn-action" id="btnImportJson">📂 讀入 JSON</button>
    <button type="button" class="btn-action" id="btnResetData">🧹 重置</button>
  </div>
</div>

<!-- 隱藏的 JSON 檔案輸入 -->
<input type="file" id="jsonFileInput" accept=".json" style="display: none;">

<!-- Modal 1: 編輯計畫預算對話框 -->

      <label>計畫名稱</label>
      <input type="text" id="modalProjectName" class="input-modal">
    </div>
    <div class="form-group-modal">
      <label>預算類別</label>
      <select id="modalProjectCategory" class="input-modal">
        <option value="公務預算">公務預算</option>

        <option value="分類總計">分類總計</option>

    </div>
    <div class="form-group-modal">
      <label>各年度預算數（單位：千元）</label>

    <button type="button" class="btn-action btn-action-hero" id="btnSaveProjectEdit" style="width: 100%; margin-top: 10px; padding: 10px;">💾 儲存變更</button>
  </div>
</div>

      { id: "p_39", name: "流域綜合治理第3期特別預算(107-108)", category: "特別預算", budgets: {"91":0,"92":0,"93":0,"94":0,"95":0,"96":0,"97":0,"98":0,"99":0,"100":0,"101":0,"102":0,"103":0,"104":0,"105":0,"106":0,"107":10000000,"108":5100000,"109":0} },
      { id: "p_40", name: "前瞻基礎建設計畫第1期特別預算(106-107)", category: "特別預算", budgets: {"91":0,"92":0,"93":0,"94":0,"95":0,"96":0,"97":0,"98":0,"99":0,"100":0,"101":0,"102":0,"103":0,"104":0,"105":0,"106":7970000,"107":6894000,"108":0,"109":0} },
      { id: "p_41", name: "前瞻基礎建設計畫第2期特別預算(108-109)", category: "特別預算", budgets: {"91":0,"92":0,"93":0,"94":0,"95":0,"96":0,"97":0,"98":0,"99":0,"100":0,"101":0,"102":0,"103":0,"104":0,"105":0,"106":0,"107":0,"108":14374900,"109":23859235} }
    ]
  };

  let appState = {
    data: null,
    searchKey: '',
    selectedCategory: 'ALL',
    startYear: '91',
    endYear: '109',
    editingProjectId: null
  };

  // PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=7.0')
        .then(reg => console.log('SW註冊成功'))
        .catch(err => console.log('SW註冊失敗', err));
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadAppState();
    initUIEvents();
    renderApp();
  });

  function loadAppState() {
    const saved = localStorage.getItem('wra_budget_app_data_v1');
    if (saved) {
      try {
        appState.data = JSON.parse(saved);
      } catch (e) {
        appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
      }
    } else {
      appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
    }

    const sortedYears = [...appState.data.years].sort((a,b) => parseInt(a)-parseInt(b));
    appState.startYear = sortedYears[0];
    appState.endYear = sortedYears[sortedYears.length - 1];
  }

  function saveAppState() {
    localStorage.setItem('wra_budget_app_data_v1', JSON.stringify(appState.data));
  }

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
    setTimeout(() => { msgEl.style.display = 'none'; }, 4000);
  }

  // 千元轉億元/萬元顯示
  function formatMoneyText(valThousand) {
    if (!valThousand || valThousand === 0) return '0 元';
    const valNTD = valThousand * 1000;
    if (Math.abs(valNTD) >= 100000000) {
      const yi = (valNTD / 100000000).toFixed(2);
      return `${yi} 億元`;
    } else if (Math.abs(valNTD) >= 10000) {
      const wan = (valNTD / 10000).toFixed(0);
      return `${wan} 萬元`;
    }
    return `${valThousand} 千元`;
  }

  function initUIEvents() {
    document.getElementById('searchInput').addEventListener('input', (e) => {
      appState.searchKey = e.target.value.trim();
      renderApp();
    });

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        appState.selectedCategory = btn.getAttribute('data-cat');
        renderApp();
      });
    });

    document.getElementById('startYearSelect').addEventListener('change', (e) => {
      appState.startYear = e.target.value;
      renderApp();
    });

    document.getElementById('endYearSelect').addEventListener('change', (e) => {
      appState.endYear = e.target.value;
      renderApp();
    });

    // 動態新增年度 (例如 110、111...115年)
    document.getElementById('btnAddYearBtn').addEventListener('click', () => {
      const years = appState.data.years.map(y => parseInt(y));
      const maxYear = Math.max(...years);
      const nextYear = (maxYear + 1).toString();

      if (confirm(`確定新增 ${nextYear} 年度數據欄位？`)) {
        appState.data.years.push(nextYear);
        appState.data.projects.forEach(p => {
          if (!p.budgets) p.budgets = {};
          p.budgets[nextYear] = 0;
        });
        appState.endYear = nextYear;
        saveAppState();
        renderApp();
        showStatus(`已成功擴充 ${nextYear} 年度欄位！可編輯補輸入預算。`, 'success');
      }
    });

    // 新增計畫
    document.getElementById('btnAddProjectBtn').addEventListener('click', () => {
      const pName = prompt('請輸入新計畫名稱：');
      if (!pName) return;
      const newId = `p_${Date.now()}`;
      const newP = {
        id: newId,
        name: pName,
        category: '公務預算',
        budgets: {}
      };
      appState.data.years.forEach(y => newP.budgets[y] = 0);
      appState.data.projects.unshift(newP);
      saveAppState();
      renderApp();
      showStatus(`已成功新增計畫：${pName}`, 'success');
    });

    // 匯出 / 讀入 JSON / 重置
    document.getElementById('btnExportJson').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appState.data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `水利署計畫年度預算資料庫_${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      showStatus('預算資料庫 (.json) 已成功匯出備份！', 'success');
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
      document.getElementById('jsonFileInput').click();
    });

    document.getElementById('jsonFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.years && imported.projects) {
            appState.data = imported;
            saveAppState();
            renderApp();
            showStatus('成功讀入並更新預算資料庫！', 'success');
          } else {
            showStatus('格式不合：缺 years 或 projects', 'error');
          }
        } catch (err) {
          showStatus('讀取 JSON 失敗', 'error');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btnResetData').addEventListener('click', () => {
      if (confirm('確定恢復原始 91~109 年基底預算資料？自訂新增內容將被還原。')) {
        appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
        saveAppState();
        renderApp();
        showStatus('已還原為原始 91~109 年基底預算數據！', 'success');
      }
    });

    // Modal 事件
    document.getElementById('btnCloseEditModal').addEventListener('click', () => {
      document.getElementById('editModal').style.display = 'none';
    });

    document.getElementById('btnSaveProjectEdit').addEventListener('click', saveProjectModalEdit);
  }

  function renderApp() {
    renderYearSelects();
    renderKPIAndList();
  }

  function renderYearSelects() {
    const sortedYears = [...appState.data.years].sort((a,b) => parseInt(a)-parseInt(b));
    const startSel = document.getElementById('startYearSelect');
    const endSel = document.getElementById('endYearSelect');

    startSel.innerHTML = '';
    endSel.innerHTML = '';

    sortedYears.forEach(y => {
      startSel.innerHTML += `<option value="${y}" ${y === appState.startYear ? 'selected':''}>${y}年</option>`;
      endSel.innerHTML += `<option value="${y}" ${y === appState.endYear ? 'selected':''}>${y}年</option>`;
    });

    document.getElementById('kpiLatestYear').innerText = `${sortedYears[sortedYears.length - 1]} 年`;
  }

  function getSelectedYearsRange() {
    const start = parseInt(appState.startYear);
    const end = parseInt(appState.endYear);
    const minY = Math.min(start, end);
    const maxY = Math.max(start, end);

    return appState.data.years.filter(y => {
      const val = parseInt(y);
      return val >= minY && val <= maxY;
    }).sort((a,b) => parseInt(a)-parseInt(b));
  }

  function renderKPIAndList() {
    const rangeYears = getSelectedYearsRange();
    const container = document.getElementById('projectListContainer');
    container.innerHTML = '';

    let grandTotalThousand = 0;
    let filteredProjectsCount = 0;

    const filteredProjects = appState.data.projects.filter(p => {
      // 關鍵字過濾
      if (appState.searchKey && !p.name.includes(appState.searchKey)) return false;
      // 類別過濾
      if (appState.selectedCategory !== 'ALL' && p.category !== appState.selectedCategory) return false;
      return true;
    });

    filteredProjects.forEach(p => {
      filteredProjectsCount++;

      // 計算選定區間總額
      let pRangeTotal = 0;
      rangeYears.forEach(y => {
        pRangeTotal += (p.budgets[y] || 0);
      });

      if (p.category !== '分類總計') {
        grandTotalThousand += pRangeTotal;
      }

      const latestYear = rangeYears[rangeYears.length - 1];
      const latestBudget = p.budgets[latestYear] || 0;

      let badgeClass = 'badge-gov';
      if (p.category === '特別預算') badgeClass = 'badge-spec';
      if (p.category === '分類總計') badgeClass = 'badge-total';

      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div class="project-card-header">
          <div class="project-title">${p.name}</div>
          <span class="category-badge ${badgeClass}">${p.category}</span>
        </div>
        <div class="budget-summary-row">
          <div>
            <span class="summary-item-label">${appState.startYear}~${appState.endYear}年累計：</span>
            <span class="summary-item-val">${formatMoneyText(pRangeTotal)}</span>
          </div>
          <div>
            <span class="summary-item-label">${latestYear}年：</span>
            <span class="summary-item-val">${formatMoneyText(latestBudget)}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-sm btn-outline" onclick="toggleDetails('${p.id}')">📊 歷年明細</button>
          <button class="btn-sm btn-primary-sm" onclick="openEditModal('${p.id}')">✏️ 編輯數據</button>
          <button class="btn-sm btn-outline" onclick="copySummaryText('${p.id}')">📋 複製摘要</button>
        </div>
        <div class="details-table-wrapper" id="details_${p.id}">
          <table class="details-table">
            <thead>
              <tr><th>年度</th><th>預算金額 (千元)</th><th>換算</th></tr>
            </thead>
            <tbody>
              ${rangeYears.map(y => `
                <tr>
                  <td style="text-align:center;">\${y}年</td>
                  <td>\${(p.budgets[y] || 0).toLocaleString()}</td>
                  <td>\${formatMoneyText(p.budgets[y] || 0)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      container.appendChild(card);
    });

    document.getElementById('kpiTotalBudget').innerText = formatMoneyText(grandTotalThousand);
    document.getElementById('kpiProjectCount').innerText = `${filteredProjectsCount} 筆`;
  }

  function toggleDetails(pid) {
    const el = document.getElementById(`details_${pid}`);
    if (el) {
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
  }

  function openEditModal(pid) {
    appState.editingProjectId = pid;
    const p = appState.data.projects.find(item => item.id === pid);
    if (!p) return;

    document.getElementById('modalProjectName').value = p.name;
    document.getElementById('modalProjectCategory').value = p.category;

    const grid = document.getElementById('modalBudgetInputs');
    grid.innerHTML = '';

    const sortedYears = [...appState.data.years].sort((a,b) => parseInt(a)-parseInt(b));
    sortedYears.forEach(y => {
      const val = p.budgets[y] || 0;
      grid.innerHTML += `
        <div class="form-group-modal">
          <label>${y} 年預算 (千元)</label>
          <input type="number" class="input-modal modal-year-input" data-year="${y}" value="${val}">
        </div>
      `;
    });

    document.getElementById('editModal').style.display = 'flex';
  }

  function saveProjectModalEdit() {
    const pid = appState.editingProjectId;
    const p = appState.data.projects.find(item => item.id === pid);
    if (!p) return;

    p.name = document.getElementById('modalProjectName').value.trim();
    p.category = document.getElementById('modalProjectCategory').value;

    document.querySelectorAll('.modal-year-input').forEach(input => {
      const y = input.getAttribute('data-year');
      p.budgets[y] = parseInt(input.value) || 0;
    });

    saveAppState();
    document.getElementById('editModal').style.display = 'none';
    renderApp();
    showStatus('已成功儲存預算數據變更！', 'success');
  }

  // 複製速報單 / 公文簡報摘要
  function copySummaryText(pid) {
    const p = appState.data.projects.find(item => item.id === pid);
    if (!p) return;

    const rangeYears = getSelectedYearsRange();
    let totalThousand = 0;
    rangeYears.forEach(y => totalThousand += (p.budgets[y] || 0));

    const latestYear = rangeYears[rangeYears.length - 1];
    const latestBudget = p.budgets[latestYear] || 0;

    const summaryStr = `${p.name}於 ${appState.startYear} 年至 ${appState.endYear} 年間累計編列預算共 ${formatMoneyText(totalThousand)}，其中 ${latestYear} 年度編列 ${formatMoneyText(latestBudget)}。`;

    navigator.clipboard.writeText(summaryStr).then(() => {
      showStatus('已複製陳報摘要文字至剪貼簿！可直接貼入速報單。', 'success');
    }).catch(err => {
      prompt('請手動複製下列摘要文字：', summaryStr);
    });
  }
</script>
