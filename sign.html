<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>陳報單位首長/主管簽核 - 經濟部速報單</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <style>
    :root {
      --moea-blue: #003a6c;
      --card-bg: #ffffff;
      --primary-green: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--moea-blue);
      color: #1e293b;
      padding: 12px 10px 40px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h3 {
      color: var(--moea-blue);
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 2px solid var(--moea-blue);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .zoom-control {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 12px; background: #f8fafc; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0;
    }
    .zoom-label { font-size: 13px; color: #475569; font-weight: bold; }
    .zoom-btn {
      background: var(--moea-blue); color: white; border: none; border-radius: 6px; padding: 4px 10px; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .zoom-btn.active { background: var(--primary-green); }

    .summary-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 14px; line-height: 1.6; }
    .summary-item { margin-bottom: 12px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; }
    .summary-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .summary-label { font-weight: bold; color: var(--moea-blue); display: block; margin-bottom: 4px; }
    .summary-content { color: #1e293b; white-space: pre-wrap; word-break: break-word; }

    .font-normal { font-size: 14px; }
    .font-large { font-size: 17px; }
    .font-xlarge { font-size: 20px; }

    .canvas-container {
      width: 100%; height: 200px; border: 2px dashed var(--moea-blue); border-radius: 10px; background: #ffffff; margin-bottom: 12px; touch-action: none;
    }
    canvas { width: 100%; height: 100%; border-radius: 8px; }

    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
    .btn-submit { background: var(--primary-green); color: white; transition: all 0.2s ease; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-clear { background: #cbd5e1; color: #334155; }

    .success-box { display: none; text-align: center; padding: 30px 10px; }
    .success-title { font-size: 22px; font-weight: bold; color: var(--primary-green); margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <h3>經濟部速報單 - 主管簽核</h3>

  <div class="zoom-control">
    <span class="zoom-label">🔍 字體大小：</span>
    <button type="button" class="zoom-btn active" id="btnNormal" onclick="setFontSize('normal')">A 標準</button>
    <button type="button" class="zoom-btn" id="btnLarge" onclick="setFontSize('large')">A+ 大字</button>
    <button type="button" class="zoom-btn" id="btnXLarge" onclick="setFontSize('xlarge')">A++ 特大</button>
  </div>

  <div class="summary-box font-normal" id="summaryBox">
    <div class="summary-item">
      <span class="summary-label">🏢 陳報單位</span>
      <div class="summary-content" id="disp_unit">載入中...</div>
    </div>
    <div class="summary-item">
      <span class="summary-label">📋 案由</span>
      <div class="summary-content" id="disp_subject">載入中...</div>
    </div>
    <div class="summary-item">
      <span class="summary-label">👥 出席人員</span>
      <div class="summary-content" id="disp_attendees">載入中...</div>
    </div>
    <div class="summary-item">
      <span class="summary-label">📝 會議結論及指示事項</span>
      <div class="summary-content" id="disp_conclusions">載入中...</div>
    </div>
    <div class="summary-item">
      <span class="summary-label">💡 擬處理意見或建議事項</span>
      <div class="summary-content" id="disp_suggestions">載入中...</div>
    </div>
  </div>

  <div style="font-weight: bold; color: var(--moea-blue); margin-bottom: 6px; font-size: 15px;">✍️ 請於下方方框內親筆簽名：</div>
  <div class="canvas-container" id="canvasBox">
    <canvas id="sigCanvas"></canvas>
  </div>

  <div class="btn-group">
    <button type="button" class="btn btn-clear" id="btnClear" onclick="clearCanvas()">🧹 清除重簽</button>
    <button type="button" class="btn btn-submit" id="btnSubmit" onclick="submitSignature()">✅ 完成簽名並傳回 LINE</button>
  </div>
</div>

<div class="card success-box" id="successBox">
  <div class="success-title">🎉 簽名完成！</div>
  <div style="font-size: 15px; color: #475569; line-height: 1.5;">正在為您開啟 LINE 傳送連結予承辦人...<br><br><span style="font-size:12px; color:#94a3b8;">（傳送後此視窗即可關閉）</span></div>
</div>

<script>
  let canvas, ctx, isDrawing = false, hasSigned = false;
  let reportData = null;

  function setFontSize(size) {
    const box = document.getElementById('summaryBox');
    box.className = 'summary-box font-' + size;
    document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.remove('active'));
    if (size === 'large') document.getElementById('btnLarge').classList.add('active');
    else if (size === 'xlarge') document.getElementById('btnXLarge').classList.add('active');
    else document.getElementById('btnNormal').classList.add('active');
  }

  function initCanvas() {
    canvas = document.getElementById('sigCanvas');
    const box = document.getElementById('canvasBox');
    canvas.width = box.clientWidth * 2;
    canvas.height = box.clientHeight * 2;
    ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#000000";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
  function draw(e) { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); hasSigned = true; }
  function stopDrawing() { isDrawing = false; }
  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasSigned = false; }

  // 自動裁切 Canvas 簽名空白區域（精減容量）
  function getCroppedCanvas(sourceCanvas) {
    const context = sourceCanvas.getContext('2d');
    const w = sourceCanvas.width;
    const h = sourceCanvas.height;
    const imgData = context.getImageData(0, 0, w, h);
    let minX = w, minY = h, maxX = 0, maxY = 0;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const alpha = imgData.data[(y * w + x) * 4 + 3];
        if (alpha > 0) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (maxX < minX || maxY < minY) return null;

    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;
    const cut = document.createElement('canvas');
    cut.width = cropW;
    cut.height = cropH;
    cut.getContext('2d').putImageData(context.getImageData(minX, minY, cropW, cropH), 0, 0);
    return cut;
  }

  document.addEventListener('DOMContentLoaded', () => {
    initCanvas();
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing, { passive: false });

    const urlParams = new URLSearchParams(window.location.search);
    const dParam = urlParams.get('d');
    if (dParam) {
      try {
        const jsonStr = LZString.decompressFromEncodedURIComponent(dParam);
        reportData = JSON.parse(jsonStr);
        document.getElementById('disp_unit').innerText = reportData.reporting_unit || reportData.u || '未填寫';
        document.getElementById('disp_subject').innerText = reportData.section_subject || reportData.s || '未填寫';
        document.getElementById('disp_attendees').innerText = reportData.section_attendees || reportData.at || '無';
        document.getElementById('disp_conclusions').innerText = reportData.section_conclusions || reportData.c || '無';
        document.getElementById('disp_suggestions').innerText = reportData.section_suggestions || reportData.su || '無';
      } catch (err) {
        alert('草稿資料讀取失敗');
      }
    }
  });

  // 使用 is.gd JSONP 縮網址
  function getShortUrl(longUrl) {
    return new Promise((resolve, reject) => {
      const cbName = 'isgd_cb_' + Math.floor(Math.random() * 1000000);
      const script = document.createElement('script');
      
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.shorturl) resolve(res.shorturl);
        else reject(new Error(res ? res.errormessage : '縮網址失敗'));
      };

      script.src = `https://is.gd/create.php?format=jsonp&callback=${cbName}&url=${encodeURIComponent(longUrl)}`;
      script.onerror = () => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('縮網址網路連線失敗'));
      };

      document.body.appendChild(script);
    });
  }

  async function submitSignature() {
    if (!hasSigned) { alert('請先於方框內親筆簽名！'); return; }
    if (!reportData) { alert('草稿資料讀取異常，無法進行簽核'); return; }

    const submitBtn = document.getElementById('btnSubmit');
    submitBtn.innerText = '⏳ 處理中...';
    submitBtn.disabled = true;

    try {
      const croppedCanvas = getCroppedCanvas(canvas);
      const sigData = croppedCanvas ? croppedCanvas.toDataURL('image/png') : canvas.toDataURL('image/png');

      // 將簽名檔壓入完整草稿資料
      reportData.signature = sigData;

      const jsonStr = JSON.stringify(reportData);
      const compressed = LZString.compressToEncodedURIComponent(jsonStr);

      const reportBaseUrl = window.location.origin + window.location.pathname.replace('sign.html', 'moea-report.html');
      const longReturnUrl = `${reportBaseUrl}?s=${compressed}`;

      let shortReturnUrl = longReturnUrl;
      try {
        shortReturnUrl = await Promise.race([
          getShortUrl(longReturnUrl),
          new Promise((_, reject) => setTimeout(() => reject(new Error('縮網址逾時')), 3000))
        ]);
      } catch (err) {
        console.warn('縮網址逾時，使用原網址:', err);
      }

      const lineMsg = `長官已完成速報單簽核，請點擊開啟速報單並產出 PDF：\n\n${shortReturnUrl}`;
      const lineShareUrl = `https://line.me/R/share?text=${encodeURIComponent(lineMsg)}`;

      // 喚起 LINE 直接傳回給承辦人
      window.location.href = lineShareUrl;

      setTimeout(() => {
        document.getElementById('mainCard').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      }, 600);

    } catch (err) {
      alert('處理簽名失敗: ' + err.message);
      submitBtn.innerText = '✅ 完成簽名並傳回 LINE';
      submitBtn.disabled = false;
    }
  }
</script>
</body>
</html>
