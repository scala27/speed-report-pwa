<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>計畫年度預算速查 - 經濟部水利署</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b81ad">

  <style>
    :root {
      --primary-water: rgb(88, 178, 220);
      --primary-dark: #2b81ad;
      --primary-light: #eef7fc;
      --bg-gradient: linear-gradient(180deg, #eaf5fb 0%, #f8fafc 220px);
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-card: 16px;
      --radius-input: 10px;
      --badge-gov: #dbeafe;
      --badge-gov-text: #1e40af;
      --badge-spec: #fef3c7;
      --badge-spec-text: #92400e;
      --badge-total: #e0e7ff;
      --badge-total-text: #3730a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 12px 12px 120px 12px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* Header 卡片 */
    .hero-header-card {
      background: linear-gradient(135deg, #2b81ad 0%, rgb(88, 178, 220) 60%, #7ac6e9 100%);
      border-radius: var(--radius-card);
      padding: 20px;
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 10px 22px -5px rgba(88, 178, 220, 0.35);
      position: relative;
      overflow: hidden;
    }

    .header-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .agency-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-back-portal {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    .btn-back-portal:active { background: rgba(0, 0, 0, 0.3); }

    .hero-main-title {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* KPI 核心數據面板 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .kpi-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .kpi-value {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    /* 控制與搜尋列 */
    .control-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-card);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-input);
      margin-bottom: 10px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary-water); }

    .chip-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    .chip-btn {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    /* 年份範圍選擇 */
    .year-range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
    }

    .select-year {
      padding: 4px 8px;
      font-size: 0.82rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }

    /* 計畫卡片列表 */
    .project-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--primary-water);
      border-radius: var(--radius-card);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .project-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .project-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .badge-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .category-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-gov { background: var(--badge-gov); color: var(--badge-gov-text); }
    .badge-spec { background: var(--badge-spec); color: var(--badge-spec-text); }
    .badge-total { background: var(--badge-total); color: var(--badge-total-text); }
    .badge-period { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .budget-summary-row {
      display: flex;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .summary-item-label { color: var(--text-muted); font-weight: 600; }
    .summary-item-val { font-weight: 800; color: var(--primary-dark); }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .btn-outline { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline:active { background: #e2e8f0; }

    .btn-primary-sm { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-primary-sm:active { background: #bae6fd; }

    /* 歷年明細展開表 */
    .details-table-wrapper {
      margin-top: 10px;
      display: none;
      overflow-x: auto;
      border-top: 1px dashed #cbd5e1;
      padding-top: 10px;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .details-table th, .details-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .details-table th {
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }

    .details-footer-edit {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      padding-top: 6px;
    }

    .btn-text-edit {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 底部操作列 */
    .sticky-actions-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e2e8f0;
      padding: 10px 12px;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    }

    .actions-container {
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 10px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-action-hero {
      flex: 1.3;
      background: linear-gradient(135deg, #2b81ad 0%, rgb(88, 178, 220) 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(88, 178, 220, 0.35);
    }

    /* Modal 對話框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
    .btn-close-modal { font-size: 1.2rem; background: none; border: none; cursor: pointer; color: var(--text-muted); }

    .form-group-modal {
      margin-bottom: 12px;
    }

    .form-group-modal label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #334155;
    }

    .form-row-modal {
      display: flex;
      gap: 10px;
    }

    .input-modal {
      width: 100%;
      padding: 9px 10px;
      font-size: 0.88rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    .input-modal:focus { border-color: var(--primary-water); }

    .modal-budget-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding: 8px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    #status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      font-weight: 700;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>

<div class="app-container">
  <!-- Header 卡片 -->
  <div class="hero-header-card">
    <div class="header-top-nav">
      <div class="agency-tag">🏛️ 經濟部水利署</div>
      <a href="./index.html" class="btn-back-portal">🏠 返回工作區</a>
    </div>
    <div class="hero-main-title">計畫年度預算速查與管理</div>
  </div>

  <!-- KPI 摘要卡片 -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">選定範圍總預算</div>
      <div class="kpi-value" id="kpiTotalBudget">0 億元</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">涵蓋計畫筆數</div>
      <div class="kpi-value" id="kpiProjectCount">0 筆</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">涵蓋年度區間</div>
      <div class="kpi-value" id="kpiLatestYear">91~109年</div>
    </div>
  </div>

  <!-- 搜尋與動態過濾 -->
  <div class="control-card">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋計畫名稱（如：海岸、前瞻、淹水）...">

    <div class="chip-group">
      <button class="chip-btn active" data-cat="ALL">全部類別</button>
      <button class="chip-btn" data-cat="公務預算">公務預算</button>
      <button class="chip-btn" data-cat="特別預算">特別預算</button>
      <button class="chip-btn" data-cat="分類總計">分類總計</button>
    </div>

    <div class="year-range-row">
      <span>📅 統計檢視年度：</span>
      <div>
        <select id="startYearSelect" class="select-year"></select>
        <span>至</span>
        <select id="endYearSelect" class="select-year"></select>
      </div>
    </div>
  </div>

  <div id="status-msg"></div>

  <!-- 計畫卡片列表區 -->
  <div id="projectListContainer"></div>
</div>

<!-- 底部操作列 -->
<div class="sticky-actions-bar">
  <div class="actions-container">
    <button type="button" class="btn-action btn-action-hero" id="btnAddProjectBtn">➕ 新增計畫/新期程</button>
    <button type="button" class="btn-action" id="btnExportJson">📥 匯出 JSON</button>
    <button type="button" class="btn-action" id="btnImportJson">📂 讀入 JSON</button>
    <button type="button" class="btn-action" id="btnResetData">🧹 重置</button>
  </div>
</div>

<!-- 隱藏的 JSON 檔案輸入 -->
<input type="file" id="jsonFileInput" accept=".json" style="display: none;">

<!-- Modal 1: 新增 / 編輯計畫與期程對話框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">新增計畫與期程預算</div>
      <button class="btn-close-modal" id="btnCloseEditModal">✕</button>
    </div>
    <div class="form-group-modal">
      <label>計畫名稱</label>
      <input type="text" id="modalProjectName" class="input-modal" placeholder="例如：重要河川環境營造計畫(第2期)">
    </div>
    <div class="form-row-modal">
      <div class="form-group-modal" style="flex:1;">
        <label>預算類別</label>
        <select id="modalProjectCategory" class="input-modal">
          <option value="公務預算">公務預算</option>
          <option value="特別預算">特別預算</option>
          <option value="分類總計">分類總計</option>
        </select>
      </div>
    </div>
    <div class="form-row-modal">
      <div class="form-group-modal" style="flex:1;">
        <label>執行起始年度</label>
        <input type="number" id="modalStartYear" class="input-modal" value="110" placeholder="如 110">
      </div>
      <div class="form-group-modal" style="flex:1;">
        <label>執行結束年度 (例6年期)</label>
        <input type="number" id="modalEndYear" class="input-modal" value="115" placeholder="如 115">
      </div>
    </div>

    <button type="button" class="btn-action" id="btnGenerateYearInputs" style="width:100%; margin-bottom:10px; background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">🔄 產生該期程預算填寫欄位</button>

    <div class="form-group-modal">
      <label>期程各年度預算數（單位：千元）</label>
      <div class="modal-budget-grid" id="modalBudgetInputs"></div>
    </div>
    <button type="button" class="btn-action btn-action-hero" id="btnSaveProjectEdit" style="width: 100%; margin-top: 12px; padding: 11px;">💾 儲存計畫預算資料</button>
  </div>
</div>

  let appState = {
    data: null,
    searchKey: '',
    selectedCategory: 'ALL',
    startYear: '91',
    endYear: '109',
    editingProjectId: null
  };

  // PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=7.1')
        .then(reg => console.log('SW註冊成功'))
        .catch(err => console.log('SW註冊失敗', err));
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadAppState();
    initUIEvents();
    renderApp();
  });

  function loadAppState() {
    const saved = localStorage.getItem('wra_budget_app_data_v2');
    if (saved) {
      try {
        appState.data = JSON.parse(saved);
      } catch (e) {
        appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
      }
    } else {
      appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
    }

    const sortedYears = getSortedYearsList();
    appState.startYear = sortedYears[0];
    appState.endYear = sortedYears[sortedYears.length - 1];
  }

  function saveAppState() {
    localStorage.setItem('wra_budget_app_data_v2', JSON.stringify(appState.data));
  }

  function getSortedYearsList() {
    if (!appState.data || !appState.data.years) return ["91","109"];
    return [...appState.data.years].sort((a,b) => parseInt(a)-parseInt(b));
  }

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
    setTimeout(() => { msgEl.style.display = 'none'; }, 4000);
  }

  // 千元轉億元/萬元顯示
  function formatMoneyText(valThousand) {
    if (!valThousand || valThousand === 0) return '0 元';
    const valNTD = valThousand * 1000;
    if (Math.abs(valNTD) >= 100000000) {
      const yi = (valNTD / 100000000).toFixed(2);
      return `${yi} 億元`;
    } else if (Math.abs(valNTD) >= 10000) {
      const wan = (valNTD / 10000).toFixed(0);
      return `${wan} 萬元`;
    }
    return `${valThousand.toLocaleString()} 千元`;
  }

  function initUIEvents() {
    document.getElementById('searchInput').addEventListener('input', (e) => {
      appState.searchKey = e.target.value.trim();
      renderApp();
    });

    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        appState.selectedCategory = btn.getAttribute('data-cat');
        renderApp();
      });
    });

    document.getElementById('startYearSelect').addEventListener('change', (e) => {
      appState.startYear = e.target.value;
      renderApp();
    });

    document.getElementById('endYearSelect').addEventListener('change', (e) => {
      appState.endYear = e.target.value;
      renderApp();
    });

    // 按鈕：新增計畫 / 新期程
    document.getElementById('btnAddProjectBtn').addEventListener('click', () => {
      openProjectEditModal(null);
    });

    // 產生該期程預算填寫欄位
    document.getElementById('btnGenerateYearInputs').addEventListener('click', () => {
      const startY = parseInt(document.getElementById('modalStartYear').value) || 110;
      const endY = parseInt(document.getElementById('modalEndYear').value) || 115;

      if (startY > endY) {
        alert('起始年度不能大於結束年度！');
        return;
      }

      renderModalYearInputs(startY.toString(), endY.toString(), {});
    });

    // 匯出 / 讀入 JSON / 重置
    document.getElementById('btnExportJson').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appState.data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `水利署計畫預算資料庫_${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      showStatus('預算資料庫 (.json) 已成功匯出備份！', 'success');
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
      document.getElementById('jsonFileInput').click();
    });

    document.getElementById('jsonFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.years && imported.projects) {
            appState.data = imported;
            saveAppState();
            renderApp();
            showStatus('成功讀入並更新預算資料庫！', 'success');
          } else {
            showStatus('格式不合：缺 years 或 projects', 'error');
          }
        } catch (err) {
          showStatus('讀取 JSON 失敗', 'error');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btnResetData').addEventListener('click', () => {
      if (confirm('確定恢復原始 91~109 年基底預算資料？所有新新增的期程資料將被還原。')) {
        appState.data = JSON.parse(JSON.stringify(defaultBudgetData));
        saveAppState();
        renderApp();
        showStatus('已還原為原始 91~109 年歸檔數據！', 'success');
      }
    });

    // Modal 關閉與儲存
    document.getElementById('btnCloseEditModal').addEventListener('click', () => {
      document.getElementById('editModal').style.display = 'none';
    });

    document.getElementById('btnSaveProjectEdit').addEventListener('click', saveProjectModalEdit);
  }

  function renderApp() {
    renderYearSelects();
    renderKPIAndList();
  }

  function renderYearSelects() {
    const sortedYears = getSortedYearsList();
    const startSel = document.getElementById('startYearSelect');
    const endSel = document.getElementById('endYearSelect');

    startSel.innerHTML = '';
    endSel.innerHTML = '';

    sortedYears.forEach(y => {
      startSel.innerHTML += `<option value="${y}" ${y === appState.startYear ? 'selected':''}>${y}年</option>`;
      endSel.innerHTML += `<option value="${y}" ${y === appState.endYear ? 'selected':''}>${y}年</option>`;
    });

    document.getElementById('kpiLatestYear').innerText = `${sortedYears[0]}~${sortedYears[sortedYears.length - 1]}年`;
  }

  function getSelectedYearsRange() {
    const start = parseInt(appState.startYear);
    const end = parseInt(appState.endYear);
    const minY = Math.min(start, end);
    const maxY = Math.max(start, end);

    return getSortedYearsList().filter(y => {
      const val = parseInt(y);
      return val >= minY && val <= maxY;
    });
  }

  function renderKPIAndList() {
    const rangeYears = getSelectedYearsRange();
    const container = document.getElementById('projectListContainer');
    container.innerHTML = '';

    let grandTotalThousand = 0;
    let filteredProjectsCount = 0;

    const filteredProjects = appState.data.projects.filter(p => {
      if (appState.searchKey && !p.name.includes(appState.searchKey)) return false;
      if (appState.selectedCategory !== 'ALL' && p.category !== appState.selectedCategory) return false;
      return true;
    });

    filteredProjects.forEach(p => {
      filteredProjectsCount++;

      // 計算選定區間總額
      let pRangeTotal = 0;
      let maxYearVal = 0;
      let maxYearName = '';

      rangeYears.forEach(y => {
        const b = p.budgets[y] || 0;
        pRangeTotal += b;
        if (b > maxYearVal) {
          maxYearVal = b;
          maxYearName = y;
        }
      });

      if (p.category !== '分類總計') {
        grandTotalThousand += pRangeTotal;
      }

      let badgeClass = 'badge-gov';
      if (p.category === '特別預算') badgeClass = 'badge-spec';
      if (p.category === '分類總計') badgeClass = 'badge-total';

      const periodText = (p.startYear && p.endYear) ? `${p.startYear}~${p.endYear}年期` : '全歷年';

      const card = document.createElement('div');
      card.className = 'project-card';
      
      const cardHeaderHtml = `
        <div class="project-card-header">
          <div class="project-title">${p.name}</div>
          <div class="badge-group">
            <span class="category-badge ${badgeClass}">${p.category}</span>
            <span class="category-badge badge-period">${periodText}</span>
          </div>
        </div>
        <div class="budget-summary-row">
          <div>
            <span class="summary-item-label">${appState.startYear}~${appState.endYear}年累計：</span>
            <span class="summary-item-val">${formatMoneyText(pRangeTotal)}</span>
          </div>
          <div>
            <span class="summary-item-label">最高單年預算：</span>
            <span class="summary-item-val">${maxYearName ? maxYearName + '年 (' + formatMoneyText(maxYearVal) + ')' : '無'}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-sm btn-outline" onclick="toggleDetails('${p.id}')">📊 歷年明細</button>
          <button class="btn-sm btn-primary-sm" onclick="copySummaryText('${p.id}')">📋 複製摘要</button>
        </div>
        <div class="details-table-wrapper" id="details_${p.id}">
          ${buildDetailsTableHTML(p, rangeYears)}
          <div class="details-footer-edit">
            <button class="btn-text-edit" onclick="openProjectEditModal('${p.id}')">✏️ 更正/修訂計畫資料</button>
          </div>
        </div>
      `;
      
      card.innerHTML = cardHeaderHtml;
      container.appendChild(card);
    });

    document.getElementById('kpiTotalBudget').innerText = formatMoneyText(grandTotalThousand);
    document.getElementById('kpiProjectCount').innerText = `${filteredProjectsCount} 筆`;
  }

  // 純字串拼接建構歷年明細表格（避免嵌套 Template Literals 錯誤）
  function buildDetailsTableHTML(p, rangeYears) {
    let rowsHtml = '';
    rangeYears.forEach(y => {
      const val = p.budgets[y] || 0;
      const isZero = (val === 0);
      rowsHtml += '<tr style="' + (isZero ? 'color:#94a3b8;' : 'font-weight:600;') + '">' +
        '<td style="text-align:center;">' + y + '年</td>' +
        '<td style="text-align:right;">' + val.toLocaleString() + '</td>' +
        '<td style="text-align:right; color:#2b81ad;">' + formatMoneyText(val) + '</td>' +
      '</tr>';
    });

    return '<table class="details-table">' +
      '<thead><tr><th style="width:25%;">年度</th><th style="width:40%; text-align:right;">預算數 (千元)</th><th style="width:35%; text-align:right;">換算顯示</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody>' +
    '</table>';
  }

  function toggleDetails(pid) {
    const el = document.getElementById(`details_${pid}`);
    if (el) {
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
  }

  // 開啟 Modal（新增或編輯特定期程）
  function openProjectEditModal(pid) {
    appState.editingProjectId = pid;
    const titleEl = document.getElementById('editModalTitle');

    if (pid) {
      const p = appState.data.projects.find(item => item.id === pid);
      if (!p) return;

      titleEl.innerText = `更正：${p.name}`;
      document.getElementById('modalProjectName').value = p.name;
      document.getElementById('modalProjectCategory').value = p.category;
      document.getElementById('modalStartYear').value = p.startYear || '91';
      document.getElementById('modalEndYear').value = p.endYear || '109';
      renderModalYearInputs(p.startYear || '91', p.endYear || '109', p.budgets);
    } else {
      titleEl.innerText = '新增計畫與期程預算';
      document.getElementById('modalProjectName').value = '';
      document.getElementById('modalProjectCategory').value = '公務預算';
      document.getElementById('modalStartYear').value = '110';
      document.getElementById('modalEndYear').value = '115';
      renderModalYearInputs('110', '115', {});
    }

    document.getElementById('editModal').style.display = 'flex';
  }

  function renderModalYearInputs(startYStr, endYStr, existingBudgets) {
    const grid = document.getElementById('modalBudgetInputs');
    grid.innerHTML = '';

    const startY = parseInt(startYStr);
    const endY = parseInt(endYStr);

    for (let y = startY; y <= endY; y++) {
      const yKey = y.toString();
      const val = existingBudgets[yKey] || 0;
      grid.innerHTML += `
        <div class="form-group-modal">
          <label>${yKey} 年預算 (千元)</label>
          <input type="number" class="input-modal modal-year-input" data-year="${yKey}" value="${val}">
        </div>
      `;
    }
  }

  function saveProjectModalEdit() {
    const pName = document.getElementById('modalProjectName').value.trim();
    if (!pName) {
      alert('請輸入計畫名稱！');
      return;
    }

    const pCategory = document.getElementById('modalProjectCategory').value;
    const startY = document.getElementById('modalStartYear').value.trim();
    const endY = document.getElementById('modalEndYear').value.trim();

    const pid = appState.editingProjectId;
    let targetP = null;

    if (pid) {
      targetP = appState.data.projects.find(item => item.id === pid);
    } else {
      targetP = {
        id: `p_${Date.now()}`,
        budgets: {}
      };
      appState.data.projects.unshift(targetP);
    }

    targetP.name = pName;
    targetP.category = pCategory;
    targetP.startYear = startY;
    targetP.endYear = endY;

    // 將該期程年份加入系統總年份列表
    const startInt = parseInt(startY);
    const endInt = parseInt(endY);
    for (let y = startInt; y <= endInt; y++) {
      const yStr = y.toString();
      if (!appState.data.years.includes(yStr)) {
        appState.data.years.push(yStr);
      }
    }
    appState.data.years.sort((a,b) => parseInt(a)-parseInt(b));

    // 收集該期程的各年度輸入數值
    document.querySelectorAll('.modal-year-input').forEach(input => {
      const y = input.getAttribute('data-year');
      targetP.budgets[y] = parseInt(input.value) || 0;
    });

    saveAppState();
    document.getElementById('editModal').style.display = 'none';

    // 自動拉大選定區間至新期程
    appState.endYear = appState.data.years[appState.data.years.length - 1];
    renderApp();
    showStatus(`已成功儲存「${pName}」之期程預算數據！`, 'success');
  }

  // 複製速報單 / 公文簡報摘要
  function copySummaryText(pid) {
    const p = appState.data.projects.find(item => item.id === pid);
    if (!p) return;

    const rangeYears = getSelectedYearsRange();
    let totalThousand = 0;
    let maxVal = 0;
    let maxYear = '';

    rangeYears.forEach(y => {
      const val = p.budgets[y] || 0;
      totalThousand += val;
      if (val > maxVal) {
        maxVal = val;
        maxYear = y;
      }
    });

    const summaryStr = `${p.name}於 ${appState.startYear} 年至 ${appState.endYear} 年間累計編列預算共 ${formatMoneyText(totalThousand)}，其中最高單年為 ${maxYear} 年度編列 ${formatMoneyText(maxVal)}。`;

    navigator.clipboard.writeText(summaryStr).then(() => {
      showStatus('已複製陳報摘要文字至剪貼簿！可直接貼入速報單。', 'success');
    }).catch(err => {
      prompt('請手動複製下列摘要文字：', summaryStr);
    });
  }
</script>
</body>
</html>
