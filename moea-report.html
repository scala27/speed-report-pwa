<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經濟部速報單 - 打工雲</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66bab7">
  
  <!-- CDN 套件 (採用 cdnjs / jsDelivr 穩定鏈結) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

  <style>
    :root {
      --primary-teal: rgb(102, 186, 183);
      --primary-dark: #2c8582;
      --primary-light: #f0f8f8;
      --bg-gradient: linear-gradient(180deg, #f2f9f9 0%, #fafcfc 220px);
      --card-bg: #ffffff;
      --border-color: #e2eceb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-card: 18px;
      --radius-input: 12px;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 12px 12px 140px 12px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header 卡片 */
    .hero-header-card {
      background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 60%, #7edbd8 100%);
      border-radius: var(--radius-card);
      padding: 20px 20px 18px 20px;
      color: #ffffff;
      margin-bottom: 14px;
      box-shadow: 0 10px 22px -5px rgba(102, 186, 183, 0.35);
      position: relative;
      overflow: hidden;
    }

    .hero-header-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }

    .header-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .agency-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-back-portal {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    .btn-back-portal:active {
      background: rgba(0, 0, 0, 0.3);
    }

    .hero-main-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* 現代卡片區塊 */
    .card-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 3.5px solid var(--primary-teal);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px -2px rgba(15, 23, 42, 0.04);
    }

    .form-group {
      margin-bottom: 14px;
      min-width: 0;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .form-row .form-group {
      flex: 1 1 0%;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      max-width: 100%;
      padding: 11px 10px;
      font-size: 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-input);
      background-color: #ffffff;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      appearance: none;
      -webkit-appearance: none;
      box-sizing: border-box;
    }

    input[type="date"] {
      min-height: 42px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-teal);
      box-shadow: 0 0 0 3px rgba(102, 186, 183, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      font-family: inherit;
      line-height: 1.6;
    }

    /* 膠囊選擇按鈕 Grid */
    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chips-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .chip-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #f8fafc;
      color: #475569;
      border: 1.5px solid #e2e8f0;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .chip-item.secret-danger.active {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    .chip-item .check-icon {
      font-size: 0.8rem;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s ease;
    }

    .chip-item.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--primary-teal);
      box-shadow: 0 2px 8px rgba(102, 186, 183, 0.2);
    }

    .chip-item.active .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .secret-warning-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #9f1239;
      font-weight: 600;
      line-height: 1.4;
    }

    .other-unit-input {
      margin-top: 10px;
    }

    /* 長官簽名預覽區 */
    .signature-area-box {
      margin-top: 10px;
      padding: 12px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius-input);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .sig-preview-img {
      max-height: 55px;
      max-width: 100%;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 4px;
    }

    /* 雙層固定操作列 */
    .bottom-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
      z-index: 1000;
      box-shadow: 0 -4px 22px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .action-bar-inner {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 11px 6px;
      font-size: 0.88rem;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.18s ease;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* 按鈕主題色 */
    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-word { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .btn-sign { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .btn-pdf { background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(102, 186, 183, 0.35); }

    /* 長官簽名 Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      display: inline-block;
      margin: 14px 0;
    }

    .qr-container img {
      width: 180px;
      height: 180px;
      display: block;
    }

    #status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      font-weight: 700;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header 卡片 -->
  <div class="hero-header-card">
    <div class="header-top-nav">
      <div class="agency-tag">🏛️ 經濟部</div>
      <a href="./index.html" class="btn-back-portal">🏠 返回工作區</a>
    </div>
    <div class="hero-main-title">經濟部速報單</div>
  </div>

  <form id="moeaReportForm">
    <!-- 卡片 1：機密等級與案件分類 -->
    <div class="card-group">
      <div class="form-group">
        <label>機密等級（請勾選）</label>
        <div class="chips-grid" id="secretChips">
          <div class="chip-item active" data-value="無"><span>無</span><span class="check-icon">✓</span></div>
          <div class="chip-item secret-danger" data-value="機密"><span>機密</span><span class="check-icon">✓</span></div>
          <div class="chip-item secret-danger" data-value="密"><span>密</span><span class="check-icon">✓</span></div>
          <div class="chip-item secret-danger" data-value="限閱"><span>限閱</span><span class="check-icon">✓</span></div>
        </div>
        <div id="secretWarning" class="secret-warning-box">
          ⚠️ 具機密/敏感性速報單請以專人或加密信箱傳遞，避免使用一般 Email 直傳。
        </div>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label>案件分類（點擊選擇）</label>
        <div class="chips-grid" id="categoryChips">
          <div class="chip-item active" data-value="府院部長官交辦案件"><span>府院部長官交辦案件</span><span class="check-icon">✓</span></div>
          <div class="chip-item" data-value="重要會議結論"><span>重要會議結論</span><span class="check-icon">✓</span></div>
          <div class="chip-item" data-value="立委監委關切事項"><span>立委監委關切事項</span><span class="check-icon">✓</span></div>
          <div class="chip-item" data-value="其他"><span>其他</span><span class="check-icon">✓</span></div>
        </div>
      </div>
    </div>

    <!-- 卡片 2：交辦與陳報基本資訊 -->
    <div class="card-group">
      <div class="form-row">
        <div class="form-group">
          <label for="assigner">交辦長官</label>
          <input type="text" id="assigner" name="assigner">
        </div>
        <div class="form-group">
          <label for="assigned_date">交辦日期</label>
          <input type="date" id="assigned_date" name="assigned_date" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reporting_unit">陳報單位</label>
          <input type="text" id="reporting_unit" name="reporting_unit" placeholder="例如：水利署" required>
        </div>
        <div class="form-group">
          <label for="report_date">陳報日期</label>
          <input type="date" id="report_date" name="report_date" required>
        </div>
      </div>
    </div>

    <!-- 卡片 3：案由與主要會議內容 -->
    <div class="card-group">
      <div class="form-group">
        <label for="section_subject">案由：</label>
        <textarea id="section_subject" name="section_subject" rows="4" required>[輸入案由]
一、開會時間：
二、開會地點：
三、主持人：</textarea>
      </div>

      <div class="form-group">
        <label for="section_attendees">出席人員：</label>
        <textarea id="section_attendees" name="section_attendees" rows="2" placeholder="請輸入本案或會議出席人員..."></textarea>
      </div>

      <div class="form-group">
        <label for="section_conclusions">會議結論及指示事項：</label>
        <textarea id="section_conclusions" name="section_conclusions" rows="6">一、
(一)
1.
(1)</textarea>
      </div>

      <div class="form-group">
        <label for="section_suggestions">擬處意見或建議事項：</label>
        <textarea id="section_suggestions" name="section_suggestions" rows="3" placeholder="請輸入擬處意見或建議事項..."></textarea>
      </div>
    </div>

    <!-- 卡片 4：分送單位與聯絡/簽核資訊 -->
    <div class="card-group">
      <div class="form-group">
        <label>本件分送單位（勾選）</label>
        <div class="chips-grid-2col" id="dispatchChipsGroup">
          <div class="chip-item active" data-value="部長室"><span>部長室</span><span class="check-icon">✓</span></div>
          <div class="chip-item active" data-value="何政務次長室"><span>何政務次長室</span><span class="check-icon">✓</span></div>
          <div class="chip-item active" data-value="江政務次長室"><span>江政務次長室</span><span class="check-icon">✓</span></div>
          <div class="chip-item active" data-value="賴次長室"><span>賴次長室</span><span class="check-icon">✓</span></div>
          <div class="chip-item active" data-value="莊主任秘書室"><span>莊主任秘書室</span><span class="check-icon">✓</span></div>
          <div class="chip-item active" data-value="本部綜規司"><span>本部綜規司</span><span class="check-icon">✓</span></div>
          <div class="chip-item" data-value="本部國會聯絡組"><span>本部國會聯絡組</span><span class="check-icon">✓</span></div>
        </div>

        <div class="other-unit-input">
          <input type="text" id="other_unit_text" name="other_unit_text" placeholder="其他單位（例如：商業署、產業園區管理局）">
        </div>
      </div>

      <div class="form-row" style="margin-top: 14px;">
        <div class="form-group">
          <label for="contact_person">本案聯絡人</label>
          <input type="text" id="contact_person" name="contact_person" placeholder="單位/職稱/姓名">
        </div>
        <div class="form-group">
          <label for="contact_phone">聯絡電話</label>
          <input type="text" id="contact_phone" name="contact_phone" placeholder="辦公室電話/行動電話">
        </div>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label>陳報單位首長/主管簽核</label>
        <div class="signature-area-box" id="sigAreaBox" title="點擊可手動上傳簽名圖檔">
          <div id="sigPreviewContainer" style="display: none; text-align: center;">
            <img id="sigPreviewImg" class="sig-preview-img" alt="簽名檔">
          </div>
          <div id="sigStatusText" style="font-size: 0.85rem; color: #64748b; font-weight: 700;">尚未簽核（請點擊「長官簽名」發送簽核連結）</div>
        </div>
      </div>
    </div>

    <div id="status-msg"></div>
  </form>
</div>

<!-- 固定操作按鈕列 (5 顆按鈕結構) -->
<div class="bottom-action-bar">
  <div class="action-bar-inner">
    <!-- 上層：草稿儲存/載入 (2 顆按鈕) -->
    <div class="btn-row">
      <button type="button" class="btn btn-secondary" onclick="saveDraft()">💾 暫存草稿</button>
      <button type="button" class="btn btn-secondary" onclick="loadDraft()">📂 載入草稿</button>
    </div>
    <!-- 下層：輸出與簽核 (3 顆按鈕) -->
    <div class="btn-row">
      <button type="button" class="btn btn-word" onclick="handleExportDocx()">📝 產出 Word</button>
      <button type="button" class="btn btn-sign" onclick="openSignatureModal()">✍️ 長官簽名</button>
      <button type="button" class="btn btn-pdf" onclick="handleExportPDF()">📄 產出 PDF</button>
    </div>
  </div>
</div>

<!-- ✍️ 長官簽名 Modal (含 QR Code 與複製連結) -->
<div id="signModal" class="modal-overlay">
  <div class="modal-card">
    <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">遠端電子簽名</h3>
    <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 12px;">請長官使用手機掃描 QR Code 或用 LINE 開啟進行簽核</p>
    
    <div class="qr-container">
      <img id="qrCodeImg" src="" alt="簽名 QR Code">
    </div>

    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
      <button type="button" class="btn btn-secondary" style="width: 100%;" onclick="copySignLink()">📋 複製簽名連結 (發送至 LINE)</button>
      <button type="button" class="btn btn-secondary" style="width: 100%; background: #f1f5f9;" onclick="closeSignModal()">關閉視窗</button>
    </div>
  </div>
</div>

<!-- 隱藏的簽名圖檔備援上傳元件 -->
<input type="file" id="sigFileInput" accept="image/*" style="display: none;">

<script>
  const API_BASE = 'https://speed-report-api.onrender.com';
  let currentSignatureBase64 = null;
  let currentSignToken = '';
  let currentSignUrl = '';
  let pollInterval = null;

  // PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=7.2')
        .then(reg => console.log('MOEA Service Worker v7.2 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }

  // 頁面加載初始化
  document.addEventListener('DOMContentLoaded', () => {
    try {
      initApp();
    } catch (err) {
      console.error('初始化失敗:', err);
      alert('系統初始化時發生錯誤：' + err.message);
    }
  });

  function initApp() {
    const today = new Date().toISOString().split('T')[0];
    const assignDateEl = document.getElementById('assigned_date');
    const reportDateEl = document.getElementById('report_date');
    if (assignDateEl && !assignDateEl.value) assignDateEl.value = today;
    if (reportDateEl && !reportDateEl.value) reportDateEl.value = today;

    // 機密等級切換
    document.querySelectorAll('#secretChips .chip-item').forEach(chip => {
      chip.addEventListener('click', () => {
        const val = chip.getAttribute('data-value');
        if (val === '無') {
          document.querySelectorAll('#secretChips .chip-item').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        } else {
          const noChip = document.querySelector('#secretChips .chip-item[data-value="無"]');
          if (noChip) noChip.classList.remove('active');
          chip.classList.toggle('active');
          
          const activeSecrets = document.querySelectorAll('#secretChips .chip-item.active');
          if (activeSecrets.length === 0 && noChip) {
            noChip.classList.add('active');
          }
        }
        checkSecretWarning();
      });
    });

    // 案件分類與分送單位切換
    document.querySelectorAll('#categoryChips .chip-item, #dispatchChipsGroup .chip-item').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
      });
    });

    // 手動備援上傳簽名
    const sigBox = document.getElementById('sigAreaBox');
    const sigInput = document.getElementById('sigFileInput');
    if (sigBox && sigInput) {
      sigBox.addEventListener('click', () => sigInput.click());

  async function openSignatureModal() {
    const formData = getFormData();

      alert('請先填寫「陳報單位」與「案由」'); 
      return;

    const jsonStr = JSON.stringify(formData);
    const compressedData = LZString.compressToEncodedURIComponent(jsonStr);

    try {
      // 每次開啟皆強制將最新表單 POST 傳給伺服器
      const response = await fetch(`${API_BASE}/draft`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ draft_data: formData, ...formData })
      });
      const resData = await response.json();
      currentSignToken = resData.token;
      
      // 建立同時帶有 Token 與 離線壓縮數據的雙軌連結
      currentSignUrl = `${window.location.origin}/speed-report-pwa/sign.html?t=${currentSignToken}&d=${compressedData}`;
    } catch (err) {
      console.warn('伺服器連線延遲，啟用完全離線雙軌連結模式');
      currentSignUrl = `${window.location.origin}/speed-report-pwa/sign.html?d=${compressedData}`;

  // 西元日期格式化：2026年10月09日
  function formatADDate(dateStr) {
    if (!dateStr) return '';
    if (dateStr.includes('年') && dateStr.includes('月') && dateStr.includes('日')) {
      return dateStr;
    }
    const match = dateStr.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (match) {
      const year = match[1];
      const month = parseInt(match[2], 10);
      const day = parseInt(match[3], 10);
      return `${year}年${month}月${day}日`;
    }
    return dateStr;
  }

  let cachedFontBytes = null;

  async function generatePDFBlob(data) {
    const { PDFDocument, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    pdfDoc.registerFontkit(fontkit);

    if (!cachedFontBytes) {
      showStatus('載入字型檔 (kaiu.ttf)...', 'info');
      const fontResponse = await fetch('./kaiu.ttf');
      if (!fontResponse.ok) {
        throw new Error('無法載入 kaiu.ttf 字型檔');
      }
      cachedFontBytes = await fontResponse.arrayBuffer();
    }

    const kaiFont = await pdfDoc.embedFont(cachedFontBytes);
    let currentPage = pdfDoc.addPage([595.28, 841.89]);
    const { width, height } = currentPage.getSize();

    const marginX = 40;
    const marginTop = 35;
    const pageBottomMargin = 15;
    const printableWidth = width - (marginX * 2);

    function formatOptionText(label, isChecked) {
      return (isChecked ? '■ ' : '□ ') + label;
    }

    function measureTextWidth(text, size) {
      return kaiFont.widthOfTextAtSize(text, size);
    }

    function drawBoldText(pageObj, text, x, y, size, strokeWidth = 2.0) {
      pageObj.drawText(text, {
        x: x, y: y, size: size, font: kaiFont,
        color: rgb(0, 0, 0), strokeColor: rgb(0, 0, 0), strokeWidth: strokeWidth
      });
    }

    function processSection(title, contentText, fontSize, maxW) {
      const items = [];
      if (title) items.push({ text: title, isTitle: true, indent: 0 });

      const paragraphs = (contentText || '').split('\n');
      for (const para of paragraphs) {
        if (!para.trim()) continue;

        const trimmed = para.trim();
        let baseIndent = 16;
        let hangIndent = 16;

        if (/^[\(\（]\d+[\)\）]/.test(trimmed)) {
          baseIndent = 64; hangIndent = 74;
        } else if (/^\d+[\.\、]|^[１２３４５６７８９０]+[\.\、]/.test(trimmed)) {
          baseIndent = 48; hangIndent = 64;
        } else if (/^[\(\（][一二三四五六七八九十]+[\)\）]/.test(trimmed)) {
          baseIndent = 32; hangIndent = 64;
        } else if (/^[一二三四五六七八九十]+\s*[\u3001\uFF0C\.\s]/.test(trimmed)) {
          baseIndent = 16; hangIndent = 48;
        }

        let currentLine = '';
        let isFirstLine = true;

        for (const char of para) {
          const currentIndent = isFirstLine ? baseIndent : hangIndent;
          const currentMaxW = maxW - currentIndent;
          const testLine = currentLine + char;

          if (measureTextWidth(testLine, fontSize) > currentMaxW && currentLine !== '') {
            items.push({ text: currentLine, isTitle: false, indent: currentIndent });
            currentLine = char;
            isFirstLine = false;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine !== '') {
          const currentIndent = isFirstLine ? baseIndent : hangIndent;
          items.push({ text: currentLine, isTitle: false, indent: currentIndent });
        }
      }
      return items;
    }

    let currentY = height - marginTop;

    const rawSecrets = Array.isArray(data.secret_levels) ? data.secret_levels : [];
    const activeSecrets = rawSecrets.filter(v => v !== '無');
    
    if (activeSecrets.length > 0) {
      const secretText = `機密等級：${activeSecrets.join('、')}`;
      currentPage.drawText(secretText, {
        x: marginX + printableWidth - measureTextWidth(secretText, 10),
        y: currentY,
        size: 10,
        font: kaiFont
      });
    }

    currentY -= 12;

    const leftTitle = '經 濟 部';
    const rightTitle = '速 報 單';
    const titleSize = 22;
    const headerIndent2Chars = 2 * titleSize;

    const categories = Array.isArray(data.categories) ? data.categories : [];
    const categoryOptions = ['府院部長官交辦案件', '重要會議結論', '立委監委關切事項', '其他'];
    const catFontSize = 14;
    const catLineSpacing = 19;

    let maxCatWidth = 0;
    categoryOptions.forEach(cat => {
      const str = formatOptionText(cat, true);
      const w = measureTextWidth(str, catFontSize);
      if (w > maxCatWidth) maxCatWidth = w;
    });

    const midX = marginX + (printableWidth - maxCatWidth) / 2;
    const headerTopY = currentY;

    categoryOptions.forEach((cat, idx) => {
      const isChecked = categories.includes(cat);
      const str = formatOptionText(cat, isChecked);
      currentPage.drawText(str, {
        x: midX,
        y: headerTopY - (idx * catLineSpacing),
        size: catFontSize,
        font: kaiFont
      });
    });

    const titleCenterY = headerTopY - (1.5 * catLineSpacing) - 6;

    drawBoldText(currentPage, leftTitle, marginX + headerIndent2Chars, titleCenterY, titleSize, 2.2);

    const rightTitleW = measureTextWidth(rightTitle, titleSize);
    drawBoldText(currentPage, rightTitle, marginX + printableWidth - rightTitleW - headerIndent2Chars, titleSize, 2.2);

    currentY = headerTopY - (3.5 * catLineSpacing) - 25;

    const infoFontSize = 16;
    currentPage.drawText(`交辦長官：${data.assigner || ''}`, { x: marginX, y: currentY, size: infoFontSize, font: kaiFont });
    currentPage.drawText(`交辦日期：${formatADDate(data.assigned_date)}`, { x: marginX + 310, y: currentY, size: infoFontSize, font: kaiFont });
    
    currentY -= 22;
    currentPage.drawText(`陳報單位：${data.reporting_unit || ''}`, { x: marginX, y: currentY, size: infoFontSize, font: kaiFont });
    currentPage.drawText(`陳報日期：${formatADDate(data.report_date)}`, { x: marginX + 310, y: currentY, size: infoFontSize, font: kaiFont });

    currentY -= 16;

    let tableBoxStartY = currentY;
    const textPaddingX = 8;
    const maxTextW = printableWidth - (textPaddingX * 2);
    const tableFontSize = 16;
    const fontLeading = 22;

    const sections = [
      processSection('案由：', data.section_subject, tableFontSize, maxTextW),
      processSection('出席人員：', data.section_attendees, tableFontSize, maxTextW),
      processSection('會議結論及指示事項：', data.section_conclusions, tableFontSize, maxTextW),
      processSection('擬處意見或建議事項：', data.section_suggestions, tableFontSize, maxTextW)
    ];

    const allLineItems = [];
    sections.forEach(secItems => {
      secItems.forEach(item => allLineItems.push(item));
    });

    const footerNeededHeight = 115;
    let renderY = tableBoxStartY - 22;

    for (let i = 0; i < allLineItems.length; i++) {
      const item = allLineItems[i];
      const remainingItemsCount = allLineItems.length - i;
      const heightForRemaining = (remainingItemsCount * fontLeading) + footerNeededHeight;

      const canFitEverythingOnCurrentPage = (renderY - pageBottomMargin) >= heightForRemaining;

      if (!canFitEverythingOnCurrentPage && (renderY - fontLeading < pageBottomMargin)) {
        const currentBoxH = tableBoxStartY - (renderY + 4);
        currentPage.drawRectangle({
          x: marginX, y: renderY + 4,
          width: printableWidth, height: currentBoxH,
          borderColor: rgb(0, 0, 0), borderWidth: 1
        });

        currentPage = pdfDoc.addPage([595.28, 841.89]);
        tableBoxStartY = height - marginTop - 10;
        renderY = tableBoxStartY - 22;
      }

      if (item.isTitle) {
        drawBoldText(currentPage, item.text, marginX + textPaddingX + item.indent, renderY, tableFontSize, 2.0);
      } else {
        currentPage.drawText(item.text, {
          x: marginX + textPaddingX + item.indent, y: renderY,
          size: tableFontSize, font: kaiFont
        });
      }

      renderY -= fontLeading;

      if (i < allLineItems.length - 1 && allLineItems[i + 1].isTitle) {
        renderY -= 4;
      }
    }

    const finalBoxEndY = renderY + 4;
    const finalBoxH = tableBoxStartY - finalBoxEndY;
    currentPage.drawRectangle({
      x: marginX, y: finalBoxEndY,
      width: printableWidth, height: finalBoxH,
      borderColor: rgb(0, 0, 0), borderWidth: 1
    });

    currentY = finalBoxEndY - 18;

    if (currentY - footerNeededHeight < pageBottomMargin) {
      currentPage = pdfDoc.addPage([595.28, 841.89]);
      currentY = height - marginTop - 20;
    }

    const footerFontSize = 12;
    const dispatchUnits = Array.isArray(data.dispatch_units) ? data.dispatch_units : [];
    
    currentPage.drawText('本件分送（勾選）', { x: marginX, y: currentY, size: footerFontSize, font: kaiFont });

    const colX1 = marginX + 100;
    const colX2 = marginX + 225;
    const colX3 = marginX + 355;

    const row1List = [{ name: '部長室', x: colX1 }, { name: '何政務次長室', x: colX2 }, { name: '江政務次長室', x: colX3 }];
    row1List.forEach(item => {
      const isChecked = dispatchUnits.includes(item.name);
      currentPage.drawText(formatOptionText(item.name, isChecked), { x: item.x, y: currentY, size: footerFontSize, font: kaiFont });
    });

    currentY -= 19;

    const row2List = [{ name: '賴次長室', x: colX1 }, { name: '莊主任秘書室', x: colX2 }, { name: '本部綜規司', x: colX3 }];
    row2List.forEach(item => {
      const isChecked = dispatchUnits.includes(item.name);
      currentPage.drawText(formatOptionText(item.name, isChecked), { x: item.x, y: currentY, size: footerFontSize, font: kaiFont });
    });

    currentY -= 19;

    const hasGov = dispatchUnits.includes('本部國會聯絡組');
    currentPage.drawText(formatOptionText('本部國會聯絡組', hasGov), { x: colX1, y: currentY, size: footerFontSize, font: kaiFont });

    const hasOther = Boolean(data.other_unit_text && data.other_unit_text.trim());
    const otherBoxStr = formatOptionText('其他單位：', hasOther);
    currentPage.drawText(otherBoxStr, { x: colX2, y: currentY, size: footerFontSize, font: kaiFont });

    if (data.other_unit_text) {
      currentPage.drawText(data.other_unit_text, {
        x: colX2 + measureTextWidth(otherBoxStr, footerFontSize) + 2,
        y: currentY, size: footerFontSize, font: kaiFont
      });
    }

    currentY -= 20;

    currentPage.drawText(`本案聯絡人：${data.contact_person || ''}`, { x: marginX, y: currentY, size: footerFontSize, font: kaiFont });

    currentY -= 17;
    currentPage.drawText(`聯絡電話：${data.contact_phone || ''}`, { x: marginX, y: currentY, size: footerFontSize, font: kaiFont });

    currentY -= 22;
    currentPage.drawText(`陳報單位首長/主管簽核：`, { x: marginX, y: currentY, size: footerFontSize, font: kaiFont });

    if (currentSignatureBase64) {
      try {
        const sigImage = await pdfDoc.embedPng(currentSignatureBase64);
        currentPage.drawImage(sigImage, {
          x: marginX + 160,
          y: currentY - 8,
          width: 120,
          height: 36
        });
      } catch (e) {
        console.warn('繪製簽名圖檔失敗:', e);
      }
    }

    const pdfBytes = await pdfDoc.save();
    return new Blob([pdfBytes], { type: 'application/pdf' });
  }

  // 輔助函式
  function checkUrlForSignedData() {
    const urlParams = new URLSearchParams(window.location.search);
    const signedParam = urlParams.get('s') || urlParams.get('signed');
    if (signedParam) {
      try {
        const jsonStr = LZString.decompressFromEncodedURIComponent(signedParam);
        if (jsonStr) {
          const data = JSON.parse(jsonStr);
          applyFormData(data);
          showStatus('🎉 已成功接收長官簽名檔與速報單內容！', 'success');
        }
      } catch (err) {
        console.warn('解析簽名資料失敗:', err);
      }
    }
  }

  function updateSignatureUI(base64Png, statusMessage) {
    currentSignatureBase64 = base64Png;
    const imgEl = document.getElementById('sigPreviewImg');
    const containerEl = document.getElementById('sigPreviewContainer');
    const statusEl = document.getElementById('sigStatusText');
    if (imgEl && containerEl && statusEl) {
      imgEl.src = currentSignatureBase64;
      containerEl.style.display = 'block';
      statusEl.innerText = statusMessage || '✅ 長官已完成親筆簽名！';
      statusEl.style.color = '#059669';
    }
  }

  function checkSecretWarning() {
    const activeSecrets = Array.from(document.querySelectorAll('#secretChips .chip-item.active'))
                               .map(c => c.getAttribute('data-value'));
    const hasSecret = activeSecrets.some(v => v !== '無');
    const warnBox = document.getElementById('secretWarning');
    if (warnBox) warnBox.style.display = hasSecret ? 'block' : 'none';
  }

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    if (msgEl) {
      msgEl.style.display = 'block';
      msgEl.className = `status-${type}`;
      msgEl.innerText = text;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  }

  // 收集表單資料（附帶雙向雙重 Key 別名，確保相容 sign.html 各種讀取機制）
  function getFormData() {
    const reportingUnit = document.getElementById('reporting_unit')?.value || '';
    const assigner = document.getElementById('assigner')?.value || '';
    const assignedDate = document.getElementById('assigned_date')?.value || '';
    const reportDate = document.getElementById('report_date')?.value || '';
    const subject = document.getElementById('section_subject')?.value || '';
    const attendees = document.getElementById('section_attendees')?.value || '';
    const conclusions = document.getElementById('section_conclusions')?.value || '';
    const suggestions = document.getElementById('section_suggestions')?.value || '';
    const otherUnitText = document.getElementById('other_unit_text')?.value || '';
    const contactPerson = document.getElementById('contact_person')?.value || '';
    const contactPhone = document.getElementById('contact_phone')?.value || '';

    const secrets = [];
    document.querySelectorAll('#secretChips .chip-item.active').forEach(c => {
      const val = c.getAttribute('data-value');
      if (val) secrets.push(val);
    });

    const categories = [];
    document.querySelectorAll('#categoryChips .chip-item.active').forEach(c => {
      const val = c.getAttribute('data-value');
      if (val) categories.push(val);
    });

    const dispatch = [];
    document.querySelectorAll('#dispatchChipsGroup .chip-item.active').forEach(c => {
      const val = c.getAttribute('data-value');
      if (val) dispatch.push(val);
    });

    return {
      // 1009 完整 Key 名稱
      reporting_unit: reportingUnit,
      assigner: assigner,
      assigned_date: assignedDate,
      report_date: reportDate,
      section_subject: subject,
      section_attendees: attendees,
      section_conclusions: conclusions,
      section_suggestions: suggestions,
      other_unit_text: otherUnitText,
      contact_person: contactPerson,
      contact_phone: contactPhone,
      secret_levels: secrets,
      categories: categories,
      dispatch_units: dispatch,
      signature: currentSignatureBase64,

      // 雙向相容 Key 名稱 (確保 sign.html 能 100% 正確解析不顯示 "無")
      report_unit: reportingUnit,
      assign_boss: assigner,
      assign_date: assignedDate,
      subject: subject,
      attendees: attendees,
      content: conclusions,
      suggestion: suggestions,
      confidentiality: secrets.join('、') || '無'
    };
  }

  function applyFormData(data) {
    if (!data || typeof data !== 'object') return;

    const reportingUnitVal = data.reporting_unit || data.report_unit;
    if (reportingUnitVal !== undefined && document.getElementById('reporting_unit')) {
      document.getElementById('reporting_unit').value = reportingUnitVal;
    }

    const assignerVal = data.assigner || data.assign_boss;
    if (assignerVal !== undefined && document.getElementById('assigner')) {
      document.getElementById('assigner').value = assignerVal;
    }

    const assignedDateVal = data.assigned_date || data.assign_date;
    if (assignedDateVal !== undefined && document.getElementById('assigned_date')) {
      document.getElementById('assigned_date').value = assignedDateVal;
    }

    const reportDateVal = data.report_date;
    if (reportDateVal !== undefined && document.getElementById('report_date')) {
      document.getElementById('report_date').value = reportDateVal;
    }

    const subjectVal = data.section_subject || data.subject;
    if (subjectVal !== undefined && document.getElementById('section_subject')) {
      document.getElementById('section_subject').value = subjectVal;
    }

    const attendeesVal = data.section_attendees || data.attendees;
    if (attendeesVal !== undefined && document.getElementById('section_attendees')) {
      document.getElementById('section_attendees').value = attendeesVal;
    }

    const conclusionsVal = data.section_conclusions || data.content;
    if (conclusionsVal !== undefined && document.getElementById('section_conclusions')) {
      document.getElementById('section_conclusions').value = conclusionsVal;
    }

    const suggestionsVal = data.section_suggestions || data.suggestion;
    if (suggestionsVal !== undefined && document.getElementById('section_suggestions')) {
      document.getElementById('section_suggestions').value = suggestionsVal;
    }

    const otherUnitVal = data.other_unit_text;
    if (otherUnitVal !== undefined && document.getElementById('other_unit_text')) {
      document.getElementById('other_unit_text').value = otherUnitVal;
    }

    const contactPersonVal = data.contact_person;
    if (contactPersonVal !== undefined && document.getElementById('contact_person')) {
      document.getElementById('contact_person').value = contactPersonVal;
    }

    const contactPhoneVal = data.contact_phone;
    if (contactPhoneVal !== undefined && document.getElementById('contact_phone')) {
      document.getElementById('contact_phone').value = contactPhoneVal;
    }

    if (Array.isArray(data.secret_levels)) {
      document.querySelectorAll('#secretChips .chip-item').forEach(c => {
        const val = c.getAttribute('data-value');
        c.classList.toggle('active', data.secret_levels.includes(val));
      });
      checkSecretWarning();
    }

    if (Array.isArray(data.categories)) {
      document.querySelectorAll('#categoryChips .chip-item').forEach(c => {
        const val = c.getAttribute('data-value');
        c.classList.toggle('active', data.categories.includes(val));
      });
    }

    if (Array.isArray(data.dispatch_units)) {
      document.querySelectorAll('#dispatchChipsGroup .chip-item').forEach(c => {
        const val = c.getAttribute('data-value');
        c.classList.toggle('active', data.dispatch_units.includes(val));
      });
    }

    if (data.signature) {
      updateSignatureUI(data.signature, '✅ 已載入長官親筆簽名檔');
    }
  }

  async function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch (err) {}
    }
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      document.body.removeChild(textArea);
    } catch (err) {
      document.body.removeChild(textArea);
    }
  }
</script>

</body>
