<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經濟部速報單系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c8582">
  
  <!-- CDN 套件：pdf-lib, fontkit, lz-string, PeerJS (WebRTC P2P) -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --primary-teal: rgb(102, 186, 183);
      --primary-dark: #2c8582;
      --primary-light: #f0f8f8;
      --bg-gradient: linear-gradient(180deg, #f2f9f9 0%, #fafcfc 220px);
      --card-bg: #ffffff;
      --border-color: #e2eceb;
      --text-main: #0f172a;
      --radius-card: 18px;
      --radius-input: 12px;
      --danger-color: #ef4444;
      --success-color: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 12px 12px 120px 12px;
      line-height: 1.5;
    }

    .app-container { max-width: 600px; margin: 0 auto; }

    .hero-header-card {
      background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 60%, #7edbd8 100%);
      border-radius: var(--radius-card);
      padding: 20px;
      color: #ffffff;
      margin-bottom: 14px;
      box-shadow: 0 10px 22px -5px rgba(102, 186, 183, 0.35);
    }

    .header-top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .agency-tag { background: rgba(255, 255, 255, 0.22); padding: 4px 12px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.3); }
    .btn-back-portal { color: #ffffff; text-decoration: none; font-size: 0.82rem; font-weight: 700; background: rgba(0, 0, 0, 0.15); padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.3); }

    .hero-main-title { font-size: 1.5rem; font-weight: 800; }

    .card-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 3.5px solid var(--primary-teal);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px -2px rgba(15, 23, 42, 0.04);
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; width: 100%; }
    .form-row .form-group { flex: 1; min-width: 0; }

    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #334155; }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 11px 10px; font-size: 0.9rem; border: 1px solid #cbd5e1; border-radius: var(--radius-input); background: #ffffff;
    }
    textarea { resize: vertical; min-height: 90px; }

    .chips-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips-grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }

    .chip-item {
      display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; background: #f8fafc; color: #475569; border: 1.5px solid #e2e8f0; cursor: pointer;
    }
    .chip-item.active { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary-teal); }

    .signature-area-box {
      margin-top: 12px; padding: 12px; background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: var(--radius-input); display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .sig-preview-img { max-height: 60px; max-width: 100%; object-fit: contain; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px; }

    .sticky-actions-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); padding: 8px 6px; z-index: 1000;
    }
    .actions-container { max-width: 600px; margin: 0 auto; display: flex; gap: 3px; }

    .btn {
      padding: 8px 1px; font-size: 0.72rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;
    }
    .btn-local { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .btn-share { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .btn-share.listening { background: #fde68a; color: #92400e; animation: pulse-waiting 1.5s infinite; }
    .btn-hero { flex: 1.1; background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 100%); color: #ffffff; }
    .btn-hero.pulse-ready { animation: pulse-ready 1.2s infinite; background: linear-gradient(135deg, #059669 0%, #10b981 100%); }

    @keyframes pulse-waiting {
      0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
    }
    @keyframes pulse-ready {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    #status-msg { margin-top: 10px; padding: 10px; border-radius: 10px; font-size: 0.85rem; display: none; text-align: center; font-weight: 700; }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="hero-header-card">
    <div class="header-top-nav">
      <div class="agency-tag">🏛️ 經濟部</div>
      <a href="./index.html" class="btn-back-portal">🏠 返回工作區</a>
    </div>
    <div class="hero-main-title">經濟部速報單</div>
  </div>

  <form id="moeaReportForm">
    <div class="card-group">
      <div class="form-group">
        <label>機密等級（請勾選）</label>
        <div class="chips-grid" id="secretChips">
          <div class="chip-item active" data-value="無"><span>無</span></div>
          <div class="chip-item" data-value="機密"><span>機密</span></div>
          <div class="chip-item" data-value="密"><span>密</span></div>
          <div class="chip-item" data-value="限閱"><span>限閱</span></div>
        </div>
      </div>
      <div class="form-group">
        <label>案件分類（點擊選擇）</label>
        <div class="chips-grid" id="categoryChips">
          <div class="chip-item active" data-value="府院部長官交辦案件"><span>府院部長官交辦案件</span></div>
          <div class="chip-item" data-value="重要會議結論"><span>重要會議結論</span></div>
          <div class="chip-item" data-value="立委監委關切事項"><span>立委監委關切事項</span></div>
          <div class="chip-item" data-value="其他"><span>其他</span></div>
        </div>
      </div>
    </div>

    <div class="card-group">
      <div class="form-row">
        <div class="form-group">
          <label for="assigner">交辦長官</label>
          <input type="text" id="assigner" name="assigner" value="林署長元鵬">
        </div>
        <div class="form-group">
          <label for="assigned_date">交辦日期</label>
          <input type="date" id="assigned_date" name="assigned_date">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="reporting_unit">陳報單位</label>
          <input type="text" id="reporting_unit" name="reporting_unit" value="水利署">
        </div>
        <div class="form-group">
          <label for="report_date">陳報日期</label>
          <input type="date" id="report_date" name="report_date">
        </div>
      </div>
    </div>

    <div class="card-group">
      <div class="form-group">
        <label for="section_subject">案由：</label>
        <textarea id="section_subject" name="section_subject" rows="4">[輸入案由]
一、開會時間：
二、開會地點：
三、主持人：</textarea>
      </div>
      <div class="form-group">
        <label for="section_attendees">出席人員：</label>
        <textarea id="section_attendees" name="section_attendees" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label for="section_conclusions">會議結論及指示事項：</label>
        <textarea id="section_conclusions" name="section_conclusions" rows="5">一、
(一)
1.</textarea>
      </div>
      <div class="form-group">
        <label for="section_suggestions">擬處意見或建議事項：</label>
        <textarea id="section_suggestions" name="section_suggestions" rows="3"></textarea>
      </div>
    </div>

    <div class="card-group">
      <div class="form-group">
        <label>本件分送單位（勾選）</label>
        <div class="chips-grid-2col" id="dispatchChipsGroup">
          <div class="chip-item active" data-value="部長室"><span>部長室</span></div>
          <div class="chip-item active" data-value="何政務次長室"><span>何政務次長室</span></div>
          <div class="chip-item active" data-value="江政務次長室"><span>江政務次長室</span></div>
          <div class="chip-item active" data-value="賴次長室"><span>賴次長室</span></div>
          <div class="chip-item active" data-value="莊主任秘書室"><span>莊主任秘書室</span></div>
          <div class="chip-item active" data-value="本部綜規司"><span>本部綜規司</span></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="contact_person">本案聯絡人</label>
          <input type="text" id="contact_person" name="contact_person">
        </div>
        <div class="form-group">
          <label for="contact_phone">聯絡電話</label>
          <input type="text" id="contact_phone" name="contact_phone">
        </div>
      </div>
      <div class="form-group">
        <label>陳報單位首長/主管簽核</label>
        <div class="signature-area-box">
          <div id="sigPreviewContainer" style="display: none; text-align: center;">
            <img id="sigPreviewImg" class="sig-preview-img" alt="簽名檔">
          </div>
          <div id="sigStatusText" style="font-size: 0.85rem; color: #64748b; font-weight: 700;">尚未簽核（請傳送連結給長官簽名）</div>
        </div>
      </div>
    </div>
    <div id="status-msg"></div>
  </form>
</div>

<div class="sticky-actions-bar">
  <div class="actions-container">
    <button type="button" id="btnSaveTemp" class="btn btn-local">💾<span>暫存</span></button>
    <button type="button" id="btnLoadTemp" class="btn btn-local">📂<span>載入</span></button>
    <button type="button" id="btnShareReview" class="btn btn-share">📤<span id="shareBtnText">傳送長官簽名</span></button>
    <button type="button" id="btnExportPDF" class="btn btn-hero">📄<span id="pdfBtnText">產出 PDF</span></button>
  </div>
</div>

<script>
  let currentSignatureBase64 = null;
  let peer = null;
  let peerRoomId = null;

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    if (!document.getElementById('assigned_date').value) document.getElementById('assigned_date').value = today;
    if (!document.getElementById('report_date').value) document.getElementById('report_date').value = today;

    document.querySelectorAll('.chip-item').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('active'));
    });
  });

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
  }

  function formatROCDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return match ? `${parseInt(match[1]) - 1911}年${parseInt(match[2])}月${parseInt(match[3])}日` : dateStr;
  }

  function getFormData() {
    return {
      a: document.getElementById('assigner').value,
      ad: document.getElementById('assigned_date').value,
      u: document.getElementById('reporting_unit').value,
      d: document.getElementById('report_date').value,
      s: document.getElementById('section_subject').value,
      at: document.getElementById('section_attendees').value,
      c: document.getElementById('section_conclusions').value,
      su: document.getElementById('section_suggestions').value,
      cp: document.getElementById('contact_person').value,
      ph: document.getElementById('contact_phone').value,
      sig: currentSignatureBase64
    };
  }

  // 1. 純前端 WebRTC P2P 即時監聽與短網址生成
  document.getElementById('btnShareReview').addEventListener('click', async () => {
    const data = getFormData();
    if (!data.u || !data.s) { alert('請填寫陳報單位與案由'); return; }

    // 建立獨一無二的 P2P 房間 ID
    peerRoomId = 'moea_' + Math.random().toString(36).substring(2, 9);
    data.room = peerRoomId;

    // 開啟 WebRTC 監聽
    initPeerListener(peerRoomId);

    // 壓縮資料並組成 sign.html 的網址
    const jsonStr = JSON.stringify(data);
    const compressed = LZString.compressToEncodedURIComponent(jsonStr);
    const signBaseUrl = window.location.origin + window.location.pathname.replace('moea-report.html', 'sign.html');
    const longUrl = `${signBaseUrl}?d=${compressed}`;

    showStatus('正在生成長官專用極短網址...', 'info');

    try {
      const shortUrl = await getShortUrl(longUrl);
      const shareText = `長官您好，已為您準備好速報單草稿：\n\n🏢 陳報單位：${data.u}\n📅 陳報日期：${formatROCDate(data.d)}\n\n👇 請點擊連結進行線上審閱與親筆簽名：\n${shortUrl}`;
      
      navigator.clipboard.writeText(shareText);
      alert('🔗 長官簽名短網址已複製！已開啟「雲端即時監聽」，長官簽完名後手機將發出聲音通知您。');
      
      const shareBtn = document.getElementById('btnShareReview');
      shareBtn.classList.add('listening');
      document.getElementById('shareBtnText').innerText = '⏳ 等待長官簽名中...';
      showStatus('已開啟 P2P 即時監聽，等待長官簽名中...', 'info');
    } catch (err) {
      alert('產生短網址失敗，請再試一次');
    }
  });

  // 使用 is.gd JSONP 進行純前端縮網址
  function getShortUrl(longUrl) {
    return new Promise((resolve, reject) => {
      const cbName = 'isgd_cb_' + Math.floor(Math.random() * 1000000);
      window[cbName] = function(res) {
        delete window[cbName];
        document.body.removeChild(script);
        if (res.shorturl) resolve(res.shorturl);
        else reject(res.errormessage);
      };
      const script = document.createElement('script');
      script.src = `https://is.gd/create.php?format=jsonp&callback=${cbName}&url=${encodeURIComponent(longUrl)}`;
      script.onerror = () => reject('縮網址連線失敗');
      document.body.appendChild(script);
    });
  }

  // 初始化 WebRTC 監聽頻道
  function initPeerListener(roomId) {
    if (peer) peer.destroy();
    peer = new Peer(roomId);

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data && data.type === 'SIGNATURE_SUBMITTED') {
          currentSignatureBase64 = data.signature;
          
          // 更新 UI
          document.getElementById('sigPreviewImg').src = currentSignatureBase64;
          document.getElementById('sigPreviewContainer').style.display = 'block';
          document.getElementById('sigStatusText').innerText = '✅ 長官已完成親筆簽名！';
          document.getElementById('sigStatusText').style.color = '#059669';

          // 提示音與按鈕動畫
          playNotificationSound();
          const pdfBtn = document.getElementById('btnExportPDF');
          pdfBtn.classList.add('pulse-ready');
          document.getElementById('pdfBtnText').innerText = '📄 點擊產出最新 PDF';

          const shareBtn = document.getElementById('btnShareReview');
          shareBtn.classList.remove('listening');
          document.getElementById('shareBtnText').innerText = '傳送長官簽名';

          showStatus('🎉 長官已完成親筆簽名！已自動帶入簽名檔。', 'success');
          alert('🎉 長官已完成簽名！系統已為您帶入最新簽名檔，請點擊「產出 PDF」。');
        }
      });
    });
  }

  // 播放通知音效
  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  // PDF 生成引擎
  let cachedFontBytes = null;
  document.getElementById('btnExportPDF').addEventListener('click', async () => {
    try {
      showStatus('正在生成經濟部速報單 PDF...', 'info');
      const { PDFDocument, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      pdfDoc.registerFontkit(fontkit);

      if (!cachedFontBytes) {
        const fontRes = await fetch('./kaiu.ttf');
        cachedFontBytes = await fontRes.arrayBuffer();
      }

      const kaiFont = await pdfDoc.embedFont(cachedFontBytes);
      const page = pdfDoc.addPage([595.28, 841.89]);
      const data = getFormData();

      page.drawText('經 濟 部  速 報 單', { x: 200, y: 780, size: 22, font: kaiFont });
      page.drawText(`陳報單位：${data.u || ''}`, { x: 50, y: 730, size: 14, font: kaiFont });
      page.drawText(`陳報日期：${formatROCDate(data.d)}`, { x: 350, y: 730, size: 14, font: kaiFont });

      page.drawText(`案由：${data.s || ''}`, { x: 50, y: 680, size: 14, font: kaiFont });
      page.drawText(`會議結論：${data.c || ''}`, { x: 50, y: 550, size: 14, font: kaiFont });

      page.drawText('陳報單位首長/主管簽核：', { x: 50, y: 150, size: 14, font: kaiFont });

      if (currentSignatureBase64) {
        const sigImage = await pdfDoc.embedPng(currentSignatureBase64);
        page.drawImage(sigImage, { x: 220, y: 135, width: 120, height: 40 });
      }

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `經濟部速報單_${data.d}.pdf`;
      link.click();
      showStatus('PDF 匯出成功！', 'success');
    } catch (err) {
      showStatus('PDF 生成失敗: ' + err.message, 'error');
    }
  });
</script>
</body>
</html>
