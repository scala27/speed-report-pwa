<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水利應變填報系統入口大廳</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#58b2dc">

  <style>
    :root {
      --primary-water: rgb(88, 178, 220); /* #58b2dc */
      --primary-dark: #2b81ad;
      --bg-gradient: linear-gradient(180deg, #eaf5fb 0%, #f8fafc 220px);
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-card: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 16px 16px 40px 16px;
      line-height: 1.5;
    }

    .portal-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* 尊榮 Header 主卡片 */
    .hero-header-card {
      background: linear-gradient(135deg, #2b81ad 0%, rgb(88, 178, 220) 60%, #7ac6e9 100%);
      border-radius: var(--radius-card);
      padding: 24px 20px 22px 20px;
      color: #ffffff;
      margin-bottom: 20px;
      box-shadow: 0 10px 22px -5px rgba(88, 178, 220, 0.35);
      position: relative;
      overflow: hidden;
    }

    .hero-header-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }

    .agency-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 10px;
    }

    .hero-main-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .hero-sub-title {
      font-size: 0.88rem;
      opacity: 0.92;
      margin-top: 6px;
    }

    /* 系統選擇卡片區塊 */
    .section-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .system-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--primary-water);
      border-radius: var(--radius-card);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px -2px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .system-card:active {
      transform: scale(0.98);
      background-color: var(--primary-light);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-icon-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .system-icon {
      font-size: 1.5rem;
      background: var(--primary-light);
      padding: 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .system-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .badge-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-dev { background: #f1f5f9; color: #64748b; }

    .system-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 6px;
    }

    .btn-enter {
      margin-top: 14px;
      align-self: flex-end;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .system-card.disabled {
      opacity: 0.65;
      pointer-events: none;
      border-left-color: #cbd5e1;
    }

    .footer-info {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<div class="portal-container">
  <!-- 頂部卡片 -->
  <div class="hero-header-card">
    <div class="agency-tag">🏛️ 經濟部水利署</div>
    <div class="hero-main-title">水利應變填報系統</div>
    <div class="hero-sub-title">請選擇欲操作的防汛應變填報子系統</div>
  </div>

  <div class="section-label">可用填報子系統</div>

  <!-- 卡片 1：水利署速報單系統 (wra-report.html) -->
  <a href="./wra-report.html" class="system-card">
    <div>
      <div class="card-top-row">
        <div class="card-icon-title">
          <div class="system-icon">📄</div>
          <div class="system-title">水利署速報單系統</div>
        </div>
        <span class="badge-status badge-active">啟用中</span>
      </div>
      <div class="system-desc">
        適用於交辦事項、重要業務及會議結論速報單填寫，支援離線暫存與純前端標楷體 PDF 檔案匯出。
      </div>
    </div>
    <div class="btn-enter">進入填報系統 ➔</div>
  </a>

  <!-- 卡片 2：經濟部應變填報系統 (moea-report.html 預留) -->
  <div class="system-card disabled">
    <div>
      <div class="card-top-row">
        <div class="card-icon-title">
          <div class="system-icon">🏢</div>
          <div class="system-title">經濟部應變填報系統</div>
        </div>
        <span class="badge-status badge-dev">規劃開發中 (moea-report.html)</span>
      </div>
      <div class="system-desc">
        預留給未來新建置之經濟部防汛應變專用填報單據與彙整表單。
      </div>
    </div>
    <div class="btn-enter">尚未開放</div>
  </div>

  <div class="footer-info">
    經濟部水利署 防汛應變專用 PWA 系統 v6.2
  </div>
</div>

<script>
  // 註冊入口大廳 Service Worker v6.2
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=6.2')
        .then(reg => console.log('Portal Service Worker v6.2 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }
</script>
</body>
</html>
