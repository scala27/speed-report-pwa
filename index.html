<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>速報單填報系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d6f0ff">
  
  <!-- CDN 套件：pdf-lib, fontkit, JSZip -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #cbebfb; /* 水藍色背景 */
      color: #1e293b;
      padding: 16px 12px;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
    }
    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .version-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #16a34a; /* 綠色版本號 */
    }
    .header-divider {
      height: 2px;
      background-color: #0284c7;
      margin-top: 8px;
      border-radius: 2px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .section-label {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
      margin: 20px 0 8px 0;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #ffffff;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
      line-height: 1.6;
    }
    
    /* 分送單位核取方塊區塊 */
    .checkbox-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .other-unit-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .other-unit-row label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    /* 2x2 四彩按鈕組 */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }
    .btn {
      padding: 14px 8px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-green { background-color: #22c55e; }
    .btn-orange { background-color: #f97316; }
    .btn-red { background-color: #ef4444; }
    .btn-blue { background-color: #0284c7; }

    #status-msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <!-- 頁面標題 -->
  <div class="header-title">
    <h1>速報單填報系統 <span class="version-badge">v2.8.2-PWA-Fix</span></h1>
    <div class="header-divider"></div>
  </div>

  <form id="speedReportForm">
    <!-- 會議性質與單位 -->
    <div class="form-group">
      <label for="meeting_type">會議性質</label>
      <select id="meeting_type" name="meeting_type">
        <option value="部次長交辦事項" selected>部次長交辦事項</option>
        <option value="署長交辦事項">署長交辦事項</option>
        <option value="重要應變會議">重要應變會議</option>
        <option value="一般例行會議">一般例行會議</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigner">交辦長官</label>
        <input type="text" id="assigner" name="assigner" placeholder="">
      </div>
      <div class="form-group">
        <label for="reporting_unit">陳報單位</label>
        <input type="text" id="reporting_unit" name="reporting_unit" value="河川海岸組" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigned_date">交辦日期</label>
        <input type="date" id="assigned_date" name="assigned_date" required>
      </div>
      <div class="form-group">
        <label for="report_date">陳報日期</label>
        <input type="date" id="report_date" name="report_date" required>
      </div>
    </div>

    <!-- 壹、案由 -->
    <div class="section-label">壹、案由</div>
    <div class="form-group">
      <textarea id="section_1" name="section_1" required>一、開會時間：
二、開會地點：
三、主持人：
四、與會人員：</textarea>
    </div>

    <!-- 貳、重點說明暨續辦摘要 -->
    <div class="section-label">貳、重點說明暨續辦摘要</div>
    <div class="form-group">
      <textarea id="section_2" name="section_2" placeholder="請輸入重點說明與續辦事項..."></textarea>
    </div>

    <!-- 參、擬處理意見或建議事項 -->
    <div class="section-label">參、擬處理意見或建議事項</div>
    <div class="form-group">
      <textarea id="section_3" name="section_3" placeholder="請輸入擬處理意見..."></textarea>
    </div>

    <!-- 本件分送單位 -->
    <div class="section-label">本件分送單位 (勾選)</div>
    <div class="checkbox-container">
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="署長室"> 署長室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="王副室"> 王副室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="黃副室"> 黃副室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="陳副室"> 陳副室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="總工室"> 總工室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="主秘室"> 主秘室</label>
      </div>
      <div class="other-unit-row">
        <label class="checkbox-item"><input type="checkbox" id="chk_other_unit"> 其他單位：</label>
        <input type="text" id="other_unit_text" name="other_unit_text" placeholder="">
      </div>
    </div>

    <!-- 聯絡人與電話 -->
    <div class="form-row" style="margin-top: 16px;">
      <div class="form-group">
        <label for="contact_person">本案聯絡人</label>
        <input type="text" id="contact_person" name="contact_person" placeholder="單位/職稱/姓名">
      </div>
      <div class="form-group">
        <label for="contact_phone">聯絡電話</label>
        <input type="text" id="contact_phone" name="contact_phone" placeholder="">
      </div>
    </div>

    <!-- 功能按鈕區 (2x2) -->
    <div class="btn-grid">
      <button type="button" id="btnSaveTemp" class="btn btn-green">💾 暫存雲端</button>
      <button type="button" id="btnLoadTemp" class="btn btn-orange">📂 載入資料</button>
      <button type="button" id="btnExportPDF" class="btn btn-red">📄 產出 PDF</button>
      <button type="button" id="btnExportWord" class="btn btn-blue">📝 產出 Word</button>
    </div>

    <div id="status-msg"></div>
  </form>
</div>

<script>
  // PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }

  // 初始化預設日期
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('assigned_date').value = today;
    document.getElementById('report_date').value = today;
  });

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
  }

  let cachedFontBytes = null;

  function getFormData() {
    const form = document.getElementById('speedReportForm');
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
      if (key === 'dispatch_units') {
        if (!data[key]) data[key] = [];
        data[key].push(value);
      } else {
        data[key] = value;
      }
    });
    return data;
  }

  // 1. 本地暫存資料
  document.getElementById('btnSaveTemp').addEventListener('click', () => {
    const data = getFormData();
    localStorage.setItem('speed_report_temp_data', JSON.stringify(data));
    showStatus('資料已成功暫存至手機本地！', 'success');
  });

  // 2. 載入暫存資料
  document.getElementById('btnLoadTemp').addEventListener('click', () => {
    const saved = localStorage.getItem('speed_report_temp_data');
    if (!saved) {
      showStatus('未找到暫存資料！', 'error');
      return;
    }
    const data = JSON.parse(saved);
    Object.keys(data).forEach(key => {
      const field = document.getElementsByName(key)[0];
      if (field) {
        if (field.type === 'checkbox') {
          const checkboxes = document.getElementsByName(key);
          checkboxes.forEach(cb => {
            cb.checked = Array.isArray(data[key]) && data[key].includes(cb.value);
          });
        } else {
          field.value = data[key];
        }
      }
    });
    showStatus('已成功載入暫存資料！', 'success');
  });

  // 3. 產出純前端標楷體 PDF
  async function generatePDFBlob(data) {
    const { PDFDocument, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    pdfDoc.registerFontkit(fontkit);

    if (!cachedFontBytes) {
      showStatus('載入標楷體字型檔 (kaiu.ttf)...', 'info');
      const fontResponse = await fetch('./kaiu.ttf');
      if (!fontResponse.ok) throw new Error('無法載入 kaiu.ttf 字型檔');
      cachedFontBytes = await fontResponse.arrayBuffer();
    }

    const kaiFont = await pdfDoc.embedFont(cachedFontBytes);
    const page = pdfDoc.addPage([595.28, 841.89]); // A4
    const { width, height } = page.getSize();

    const marginX = 56.7;
    let currentY = height - 56.7;

    function wrapText(text, fontSize, maxWidth) {
      const lines = [];
      const paragraphs = (text || '').split('\n');
      for (const paragraph of paragraphs) {
        let currentLine = '';
        for (const char of paragraph) {
          const testLine = currentLine + char;
          if (kaiFont.widthOfTextAtSize(testLine, fontSize) > maxWidth && currentLine !== '') {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);
      }
      return lines;
    }

    function drawCell(x, y, w, h, bgHex = null) {
      if (bgHex) {
        page.drawRectangle({ x, y: y - h, width: w, height: h, color: rgb(0.95, 0.95, 0.95) });
      }
      page.drawRectangle({ x, y: y - h, width: w, height: h, borderColor: rgb(0, 0, 0), borderWidth: 1 });
    }

    // 標題
    const titleText = '速報單';
    const titleWidth = kaiFont.widthOfTextAtSize(titleText, 22);
    page.drawText(titleText, { x: (width - titleWidth) / 2, y: currentY - 20, size: 22, font: kaiFont });
    currentY -= 45;

    const colW = [85, 155.94, 85, 155.94];

    // 表頭資訊
    const row1H = 30;
    drawCell(marginX, currentY, colW[0], row1H, true);
    drawCell(marginX + colW[0], currentY, colW[1] + colW[2] + colW[3], row1H);
    page.drawText('會議性質', { x: marginX + 18, y: currentY - 18, size: 11, font: kaiFont });
    page.drawText(data.meeting_type || '', { x: marginX + colW[0] + 8, y: currentY - 18, size: 10.5, font: kaiFont });
    currentY -= row1H;

    // 區塊繪製函式
    function drawSection(title, content) {
      const lines = wrapText(content, 10.5, colW[1] + colW[2] + colW[3] - 16);
      const rowH = Math.max(80, lines.length * 16 + 20);
      drawCell(marginX, currentY, colW[0], rowH, true);
      drawCell(marginX + colW[0], currentY, colW[1] + colW[2] + colW[3], rowH);
      page.drawText(title, { x: marginX + 12, y: currentY - 24, size: 11, font: kaiFont });
      lines.forEach((line, idx) => {
        page.drawText(line, { x: marginX + colW[0] + 8, y: currentY - 18 - (idx * 16), size: 10.5, font: kaiFont });
      });
      currentY -= rowH;
    }

    drawSection('壹、案由', data.section_1);
    drawSection('貳、重點說明', data.section_2);
    drawSection('參、擬處理意見', data.section_3);

    const pdfBytes = await pdfDoc.save();
    return new Blob([pdfBytes], { type: 'application/pdf' });
  }

  // 匯出 PDF
  document.getElementById('btnExportPDF').addEventListener('click', async () => {
    try {
      showStatus('正在生成 PDF...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(pdfBlob);
      link.download = `速報單_${data.report_date || ''}.pdf`;
      link.click();
      showStatus('PDF 匯出成功！', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });

  // 匯出雙軌/Word 包
  document.getElementById('btnExportWord').addEventListener('click', async () => {
    try {
      showStatus('正在打包檔案...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const zip = new JSZip();
      zip.file(`速報單_${data.report_date}.pdf`, pdfBlob);
      zip.file(`速報單內容.json`, JSON.stringify(data, null, 2));
      const zipContent = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipContent);
      link.download = `速報單檔案包_${data.report_date}.zip`;
      link.click();
      showStatus('檔案包匯出成功！', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
