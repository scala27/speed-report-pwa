<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>速報單填報系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d6f0ff">
  
  <!-- CDN 套件：pdf-lib, fontkit, JSZip -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #cbebfb;
      color: #1e293b;
      padding: 16px 12px;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
    }
    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .version-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #16a34a;
    }
    .header-divider {
      height: 2px;
      background-color: #0284c7;
      margin-top: 8px;
      border-radius: 2px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .section-label {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
      margin: 20px 0 8px 0;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #ffffff;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 110px;
      font-family: inherit;
      line-height: 1.6;
    }
    
    .checkbox-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .other-unit-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .other-unit-row label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }
    .btn {
      padding: 14px 8px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-green { background-color: #22c55e; }
    .btn-orange { background-color: #f97316; }
    .btn-red { background-color: #ef4444; }
    .btn-blue { background-color: #0284c7; }

    #status-msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h1>速報單填報系統 <span class="version-badge">v3.5-BoxRestricted</span></h1>
    <div class="header-divider"></div>
  </div>

  <form id="speedReportForm">
    <!-- 會議與基本屬性 -->
    <div class="form-group">
      <label for="meeting_type">會議/案由性質</label>
      <select id="meeting_type" name="meeting_type">
        <option value="部次長交辦事項">部次長交辦事項</option>
        <option value="重要業務">重要業務</option>
        <option value="重要會議結論" selected>重要會議結論</option>
        <option value="首長訪視行程">首長訪視行程</option>
        <option value="媒體受訪">媒體受訪</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigner">交辦長官</label>
        <input type="text" id="assigner" name="assigner" value="陳副署長建成">
      </div>
      <div class="form-group">
        <label for="reporting_unit">陳報單位</label>
        <input type="text" id="reporting_unit" name="reporting_unit" value="河川海岸組" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigned_date">交辦日期</label>
        <input type="date" id="assigned_date" name="assigned_date" required>
      </div>
      <div class="form-group">
        <label for="report_date">陳報日期</label>
        <input type="date" id="report_date" name="report_date" required>
      </div>
    </div>

    <!-- 案由 -->
    <div class="section-label">案由：</div>
    <div class="form-group">
      <textarea id="section_1" name="section_1" required>115年4月2日中央畜產會董事長蘇治芬拜會經濟部次長賴建信研商虎尾潮建議案</textarea>
    </div>

    <!-- 與會人員 -->
    <div class="section-label">與會人員：</div>
    <div class="form-group">
      <textarea id="attendees" name="attendees" required>經濟部賴次長建信、中央畜產會董事長蘇治芬、都市里人規劃設計有限公司建築師林雋怡、台灣糖業公司副總經理蔡東霖、副處長陳冠翰、水利署陳副署長建成及水利署第五河川分署科長周育興等。</textarea>
    </div>

    <!-- 重點說明暨續辦摘要 -->
    <div class="section-label">重點說明暨續辦摘要：</div>
    <div class="form-group">
      <textarea id="section_2" name="section_2">一、中山路人行跨橋都市計畫審議進度：請第五河川分署儘速依雲林縣政府意見辦理修正及補充，俟與該府城鄉發展處研商共識後，再行正式函報。
二、青埔分洪道抽水站及工程界面：青埔抽水站更換位置，請第五河川分署協助雲林縣政府檢視機組抽水量能是否滿足原設計條件，並請持續追蹤該工程進度。
三、安慶圳景觀環境營造工程：請第五河川分署再檢視水質條件、水源循環利用及後續維護管理等優化評估。
四、同心公園及周邊再發展：同心公園西側台糖既有古蹟木屋群緊鄰水防道路，具有帶動周邊發展加值效益，惟現況有圍牆阻隔，不利串聯及通透，請第五河川分署與台糖公司辦理會勘，釐清相關權責並評估改善。</textarea>
    </div>

    <!-- 擬處理意見或建議事項 -->
    <div class="section-label">擬處理意見或建議事項:</div>
    <div class="form-group">
      <textarea id="section_3" name="section_3">本案後續由第五河川分署、本署河川海岸組錄案辦理。</textarea>
    </div>

    <!-- 本件分送單位 -->
    <div class="section-label">本件分送（勾選）</div>
    <div class="checkbox-container">
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="署長辦公室" checked> 署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="王副署長辦公室" checked> 王副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="黃副署長辦公室"> 黃副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="陳副署長辦公室" checked> 陳副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="總工程司室" checked> 總工程司室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="主任秘書室"> 主任秘書室</label>
      </div>
      <div class="other-unit-row">
        <label class="checkbox-item"><input type="checkbox" id="chk_other_unit" checked> 其他單位：</label>
        <input type="text" id="other_unit_text" name="other_unit_text" value="第五河川分署、河川海岸組">
      </div>
    </div>

    <!-- 聯絡人與電話 -->
    <div class="form-row" style="margin-top: 16px;">
      <div class="form-group">
        <label for="contact_person">本案聯絡人</label>
        <input type="text" id="contact_person" name="contact_person" value="河川海岸組/科長/王基安">
      </div>
      <div class="form-group">
        <label for="contact_phone">聯絡電話</label>
        <input type="text" id="contact_phone" name="contact_phone" value="04-22501223/0937775253">
      </div>
    </div>

    <!-- 功能按鈕組 (2x2) -->
    <div class="btn-grid">
      <button type="button" id="btnSaveTemp" class="btn btn-green">💾 暫存雲端</button>
      <button type="button" id="btnLoadTemp" class="btn btn-orange">📂 載入資料</button>
      <button type="button" id="btnExportPDF" class="btn btn-red">📄 產出 PDF</button>
      <button type="button" id="btnExportWord" class="btn btn-blue">📝 產出 Word</button>
    </div>

    <div id="status-msg"></div>
  </form>
</div>

<script>
  // PWA Service Worker 註冊 (帶入版本號避免快取舊檔)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=3.5')
        .then(reg => console.log('Service Worker 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }

  // 初始化日期
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    if (!document.getElementById('assigned_date').value) document.getElementById('assigned_date').value = today;
    if (!document.getElementById('report_date').value) document.getElementById('report_date').value = today;
  });

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
  }

  // 西元年轉民國年輔助函式 (例如 2026-09-17 -> 115年9月17日)
  function formatROCDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (match) {
      const rocYear = parseInt(match[1], 10) - 1911;
      const month = parseInt(match[2], 10);
      const day = parseInt(match[3], 10);
      return `${rocYear}年${month}月${day}日`;
    }
    return dateStr;
  }

  let cachedFontBytes = null;

  function getFormData() {
    const form = document.getElementById('speedReportForm');
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
      if (key === 'dispatch_units') {
        if (!data[key]) data[key] = [];
        data[key].push(value);
      } else {
        data[key] = value;
      }
    });
    return data;
  }

  // 1. 本地暫存資料
  document.getElementById('btnSaveTemp').addEventListener('click', () => {
    const data = getFormData();
    localStorage.setItem('speed_report_temp_data', JSON.stringify(data));
    showStatus('資料已成功暫存至手機本地！', 'success');
  });

  // 2. 載入暫存資料
  document.getElementById('btnLoadTemp').addEventListener('click', () => {
    const saved = localStorage.getItem('speed_report_temp_data');
    if (!saved) {
      showStatus('未找到暫存資料！', 'error');
      return;
    }
    const data = JSON.parse(saved);
    Object.keys(data).forEach(key => {
      const field = document.getElementsByName(key)[0];
      if (field) {
        if (field.type === 'checkbox') {
          const checkboxes = document.getElementsByName(key);
          checkboxes.forEach(cb => {
            cb.checked = Array.isArray(data[key]) && data[key].includes(cb.value);
          });
        } else {
          field.value = data[key];
        }
      }
    });
    showStatus('已成功載入暫存資料！', 'success');
  });

  // 3. 純前端標楷體 PDF 引擎 (限定實體表格區，其餘無框線)
  async function generatePDFBlob(data) {
    const { PDFDocument, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    pdfDoc.registerFontkit(fontkit);

    if (!cachedFontBytes) {
      showStatus('載入標楷體字型檔 (kaiu.ttf)...', 'info');
      const fontResponse = await fetch('./kaiu.ttf');
      if (!fontResponse.ok) throw new Error('無法載入 kaiu.ttf 字型檔');
      cachedFontBytes = await fontResponse.arrayBuffer();
    }

    const kaiFont = await pdfDoc.embedFont(cachedFontBytes);
    const page = pdfDoc.addPage([595.28, 841.89]); // A4 尺寸
    const { width, height } = page.getSize();

    const marginX = 40;
    const marginTop = 40;
    const printableWidth = width - (marginX * 2); // 515.28 pt

    let currentY = height - marginTop;

    // 自動折行演算法
    function wrapText(text, fontSize, maxWidth) {
      const lines = [];
      const paragraphs = (text || '').split('\n');
      for (const paragraph of paragraphs) {
        let currentLine = '';
        for (const char of paragraph) {
          const testLine = currentLine + char;
          if (kaiFont.widthOfTextAtSize(testLine, fontSize) > maxWidth && currentLine !== '') {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);
      }
      return lines;
    }

    // 繪製實體表格外框
    function drawCell(x, y, w, h) {
      page.drawRectangle({ x, y: y - h, width: w, height: h, borderColor: rgb(0, 0, 0), borderWidth: 1 });
    }

    // 格式化勾選選項文字 (原生 ■ 與 □)
    function formatOptionText(label, isChecked) {
      return (isChecked ? '■ ' : '□ ') + label;
    }

    // ====================================================
    // 1. 頁首頂部抬頭 (無框線，規格：20 pt)
    // ====================================================
    page.drawText('經濟部水利署', {
      x: marginX,
      y: currentY - 20,
      size: 20,
      font: kaiFont
    });

    const rightTitle = '辦理現況速報單';
    const rightTitleWidth = kaiFont.widthOfTextAtSize(rightTitle, 20);
    page.drawText(rightTitle, {
      x: marginX + printableWidth - rightTitleWidth,
      y: currentY - 20,
      size: 20,
      font: kaiFont
    });

    currentY -= 35;

    // ====================================================
    // 2. 表頭基本資料 (無框線，規格：15 pt)
    // ====================================================
    const halfW = printableWidth / 2;

    // 第一列：交辦長官 / 交辦日期
    page.drawText(`交辦長官：${data.assigner || ''}`, {
      x: marginX,
      y: currentY - 15,
      size: 15,
      font: kaiFont
    });
    page.drawText(`交辦日期：${formatROCDate(data.assigned_date)}`, {
      x: marginX + halfW,
      y: currentY - 15,
      size: 15,
      font: kaiFont
    });
    currentY -= 22;

    // 第二列：陳報單位 / 陳報日期
    page.drawText(`陳報單位：${data.reporting_unit || ''}`, {
      x: marginX,
      y: currentY - 15,
      size: 15,
      font: kaiFont
    });
    page.drawText(`陳報日期：${formatROCDate(data.report_date)}`, {
      x: marginX + halfW,
      y: currentY - 15,
      size: 15,
      font: kaiFont
    });
    currentY -= 28;

    // ====================================================
    // 3. 會議/案由性質勾選區 (無框線，一欄六行垂直排列，規格：12 pt)
    // ====================================================
    const types = [
      '部次長交辦事項',
      '重要業務',
      '重要會議結論',
      '首長訪視行程',
      '媒體受訪',
      '其他'
    ];

    types.forEach(t => {
      const isChecked = (data.meeting_type === t);
      const str = formatOptionText(t, isChecked);
      page.drawText(str, {
        x: marginX,
        y: currentY - 12,
        size: 12,
        font: kaiFont
      });
      currentY -= 18;
    });

    currentY -= 10;

    // ====================================================
    // 4. 實體表格內文區 (全單唯一有框線區域，四大區塊標題與內文均為 16 pt)
    // ====================================================

    // 區塊 1: 案由：
    const sec1Lines = wrapText(data.section_1, 16, printableWidth - 20);
    const sec1H = Math.max(55, sec1Lines.length * 22 + 32);
    drawCell(marginX, currentY, printableWidth, sec1H);

    page.drawText('案由：', {
      x: marginX + 10,
      y: currentY - 22,
      size: 16,
      font: kaiFont
    });

    sec1Lines.forEach((line, idx) => {
      page.drawText(line, {
        x: marginX + 10,
        y: currentY - 46 - (idx * 22),
        size: 16,
        font: kaiFont
      });
    });
    currentY -= sec1H;

    // 區塊 2: 與會人員：
    const attendeeLines = wrapText(data.attendees, 16, printableWidth - 20);
    const attendeeH = Math.max(55, attendeeLines.length * 22 + 32);
    drawCell(marginX, currentY, printableWidth, attendeeH);

    page.drawText('與會人員：', {
      x: marginX + 10,
      y: currentY - 22,
      size: 16,
      font: kaiFont
    });

    attendeeLines.forEach((line, idx) => {
      page.drawText(line, {
        x: marginX + 10,
        y: currentY - 46 - (idx * 22),
        size: 16,
        font: kaiFont
      });
    });
    currentY -= attendeeH;

    // 區塊 3: 重點說明暨續辦摘要：
    const sec2Lines = wrapText(data.section_2, 16, printableWidth - 20);
    const sec2H = Math.max(120, sec2Lines.length * 22 + 32);
    drawCell(marginX, currentY, printableWidth, sec2H);

    page.drawText('重點說明暨續辦摘要：', {
      x: marginX + 10,
      y: currentY - 22,
      size: 16,
      font: kaiFont
    });

    sec2Lines.forEach((line, idx) => {
      page.drawText(line, {
        x: marginX + 10,
        y: currentY - 46 - (idx * 22),
        size: 16,
        font: kaiFont
      });
    });
    currentY -= sec2H;

    // 區塊 4: 擬處理意見或建議事項:
    const sec3Lines = wrapText(data.section_3, 16, printableWidth - 20);
    const sec3H = Math.max(55, sec3Lines.length * 22 + 32);
    drawCell(marginX, currentY, printableWidth, sec3H);

    page.drawText('擬處理意見或建議事項:', {
      x: marginX + 10,
      y: currentY - 22,
      size: 16,
      font: kaiFont
    });

    sec3Lines.forEach((line, idx) => {
      page.drawText(line, {
        x: marginX + 10,
        y: currentY - 46 - (idx * 22),
        size: 16,
        font: kaiFont
      });
    });
    currentY -= sec3H;

    currentY -= 15;

    // ====================================================
    // 5. 本件分送（勾選） (無框線，規格：12 pt)
    // ====================================================
    const dispatchUnits = Array.isArray(data.dispatch_units) ? data.dispatch_units : [data.dispatch_units].filter(Boolean);

    page.drawText('本件分送（勾選）', {
      x: marginX,
      y: currentY - 14,
      size: 12,
      font: kaiFont
    });

    // 列 1: 署長辦公室, 王副署長辦公室, 黃副署長辦公室, 陳副署長辦公室
    const row1Units = ['署長辦公室', '王副署長辦公室', '黃副署長辦公室', '陳副署長辦公室'];
    let dX1 = marginX + 105;
    row1Units.forEach(u => {
      const isChecked = dispatchUnits.includes(u);
      const str = formatOptionText(u, isChecked);
      page.drawText(str, {
        x: dX1,
        y: currentY - 14,
        size: 12,
        font: kaiFont
      });
      dX1 += 102;
    });

    currentY -= 20;

    // 列 2: 總工程司室, 主任秘書室
    const row2Units = ['總工程司室', '主任秘書室'];
    let dX2 = marginX;
    row2Units.forEach(u => {
      const isChecked = dispatchUnits.includes(u);
      const str = formatOptionText(u, isChecked);
      page.drawText(str, {
        x: dX2,
        y: currentY - 14,
        size: 12,
        font: kaiFont
      });
      dX2 += 115;
    });

    currentY -= 20;

    // 列 3: 其他單位
    const hasOther = Boolean(data.other_unit_text && data.other_unit_text.trim());
    const otherBoxStr = formatOptionText('其他單位：', hasOther);
    page.drawText(otherBoxStr, {
      x: marginX,
      y: currentY - 14,
      size: 12,
      font: kaiFont
    });

    if (data.other_unit_text) {
      const prefixW = kaiFont.widthOfTextAtSize(otherBoxStr, 12);
      page.drawText(data.other_unit_text, {
        x: marginX + prefixW + 2,
        y: currentY - 14,
        size: 12,
        font: kaiFont
      });
    }

    currentY -= 25;

    // ====================================================
    // 6. 聯絡資訊區 (無框線，規格：12 pt)
    // ====================================================
    page.drawText(`本案聯絡人：${data.contact_person || ''}`, {
      x: marginX,
      y: currentY - 14,
      size: 12,
      font: kaiFont
    });

    page.drawText(`聯絡電話：${data.contact_phone || ''}`, {
      x: marginX + halfW,
      y: currentY - 14,
      size: 12,
      font: kaiFont
    });

    const pdfBytes = await pdfDoc.save();
    return new Blob([pdfBytes], { type: 'application/pdf' });
  }

  // 匯出 PDF 檔
  document.getElementById('btnExportPDF').addEventListener('click', async () => {
    try {
      showStatus('正在生成依據最新標準規格之 PDF...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(pdfBlob);
      link.download = `速報單_${data.report_date || ''}.pdf`;
      link.click();
      showStatus('PDF 匯出成功！版面與字號已完全符合最新標準。', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });

  // 匯出雙軌/Word 包
  document.getElementById('btnExportWord').addEventListener('click', async () => {
    try {
      showStatus('正在打包檔案...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const zip = new JSZip();
      zip.file(`速報單_${data.report_date}.pdf`, pdfBlob);
      zip.file(`速報單內容.json`, JSON.stringify(data, null, 2));
      const zipContent = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipContent);
      link.download = `速報單檔案包_${data.report_date}.zip`;
      link.click();
      showStatus('檔案包匯出成功！', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
