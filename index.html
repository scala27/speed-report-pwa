<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>速報單填報系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d6f0ff">
  
  <!-- CDN 套件：pdf-lib, fontkit, JSZip -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #cbebfb;
      color: #1e293b;
      padding: 16px 12px;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
    }
    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .version-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #16a34a;
    }
    .header-divider {
      height: 2px;
      background-color: #0284c7;
      margin-top: 8px;
      border-radius: 2px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 12px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .section-label {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
      margin: 20px 0 8px 0;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #ffffff;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
      line-height: 1.6;
    }
    
    .checkbox-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .other-unit-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .other-unit-row label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }
    .btn {
      padding: 14px 8px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-green { background-color: #22c55e; }
    .btn-orange { background-color: #f97316; }
    .btn-red { background-color: #ef4444; }
    .btn-blue { background-color: #0284c7; }

    #status-msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h1>速報單填報系統 <span class="version-badge">v4.6</span></h1>
    <div class="header-divider"></div>
  </div>

  <form id="speedReportForm">
    <!-- 會議與基本屬性 -->
    <div class="form-group">
      <label for="meeting_type">會議/案由性質</label>
      <select id="meeting_type" name="meeting_type">
        <option value="部次長交辦事項">部次長交辦事項</option>
        <option value="重要業務">重要業務</option>
        <option value="重要會議結論" selected>重要會議結論</option>
        <option value="首長訪視行程">首長訪視行程</option>
        <option value="媒體受訪">媒體受訪</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigner">交辦長官</label>
        <input type="text" id="assigner" name="assigner">
      </div>
      <div class="form-group">
        <label for="reporting_unit">陳報單位</label>
        <input type="text" id="reporting_unit" name="reporting_unit" placeholder="例如：河川海岸組" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="assigned_date">交辦日期</label>
        <input type="date" id="assigned_date" name="assigned_date" required>
      </div>
      <div class="form-group">
        <label for="report_date">陳報日期</label>
        <input type="date" id="report_date" name="report_date" required>
      </div>
    </div>

    <!-- 壹、案由： (預設固定內容) -->
    <div class="section-label">壹、案由：</div>
    <div class="form-group">
      <textarea id="section_1" name="section_1" rows="5" required>一、開會時間：
二、開會地點：
三、主持人：
四、與會人員：</textarea>
    </div>

    <!-- 貳、重點說明暨續辦摘要： (預設固定內容) -->
    <div class="section-label">貳、重點說明暨續辦摘要：</div>
    <div class="form-group">
      <textarea id="section_2" name="section_2" rows="7">一、
(一)
1.
(1)</textarea>
    </div>

    <!-- 叁、擬處理意見或建議事項： -->
    <div class="section-label">叁、擬處理意見或建議事項：</div>
    <div class="form-group">
      <textarea id="section_3" name="section_3" rows="3" placeholder="請輸入擬處理意見或建議事項..."></textarea>
    </div>

    <!-- 本件分送單位 -->
    <div class="section-label">本件分送（勾選）</div>
    <div class="checkbox-container">
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="署長辦公室"> 署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="王副署長辦公室"> 王副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="黃副署長辦公室"> 黃副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="陳副署長辦公室"> 陳副署長辦公室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="總工程司室"> 總工程司室</label>
        <label class="checkbox-item"><input type="checkbox" name="dispatch_units" value="主任秘書室"> 主任秘書室</label>
      </div>
      <div class="other-unit-row">
        <label class="checkbox-item"><input type="checkbox" id="chk_other_unit"> 其他單位：</label>
        <input type="text" id="other_unit_text" name="other_unit_text" placeholder="例如：河川海岸組、國會組">
      </div>
    </div>

    <!-- 聯絡人與電話 -->
    <div class="form-row" style="margin-top: 16px;">
      <div class="form-group">
        <label for="contact_person">本案聯絡人</label>
        <input type="text" id="contact_person" name="contact_person" placeholder="單位/職稱/姓名">
      </div>
      <div class="form-group">
        <label for="contact_phone">聯絡電話</label>
        <input type="text" id="contact_phone" name="contact_phone" placeholder="辦公室電話/行動電話">
      </div>
    </div>

    <!-- 功能按鈕組 (2x2) -->
    <div class="btn-grid">
      <button type="button" id="btnSaveTemp" class="btn btn-green">💾 暫存雲端</button>
      <button type="button" id="btnLoadTemp" class="btn btn-orange">📂 載入資料</button>
      <button type="button" id="btnExportPDF" class="btn btn-red">📄 產出 PDF</button>
      <button type="button" id="btnExportWord" class="btn btn-blue">📝 產出 Word</button>
    </div>

    <div id="status-msg"></div>
  </form>
</div>

<script>
  // PWA Service Worker 註冊 (更新版號 v4.6 強制刷新快取)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=4.6')
        .then(reg => console.log('Service Worker 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }

  // 初始化日期
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    if (!document.getElementById('assigned_date').value) document.getElementById('assigned_date').value = today;
    if (!document.getElementById('report_date').value) document.getElementById('report_date').value = today;
  });

  function showStatus(text, type = 'info') {
    const msgEl = document.getElementById('status-msg');
    msgEl.style.display = 'block';
    msgEl.className = `status-${type}`;
    msgEl.innerText = text;
  }

  // 西元年轉民國年輔助函式 (例如 2026-10-03 -> 115年10月3日)
  function formatROCDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (match) {
      const rocYear = parseInt(match[1], 10) - 1911;
      const month = parseInt(match[2], 10);
      const day = parseInt(match[3], 10);
      return `${rocYear}年${month}月${day}日`;
    }
    return dateStr;
  }

  let cachedFontBytes = null;

  function getFormData() {
    const form = document.getElementById('speedReportForm');
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
      if (key === 'dispatch_units') {
        if (!data[key]) data[key] = [];
        data[key].push(value);
      } else {
        data[key] = value;
      }
    });
    return data;
  }

  // 1. 本地暫存資料
  document.getElementById('btnSaveTemp').addEventListener('click', () => {
    const data = getFormData();
    localStorage.setItem('speed_report_temp_data', JSON.stringify(data));
    showStatus('資料已成功暫存至手機本地！', 'success');
  });

  // 2. 載入暫存資料
  document.getElementById('btnLoadTemp').addEventListener('click', () => {
    const saved = localStorage.getItem('speed_report_temp_data');
    if (!saved) {
      showStatus('未找到暫存資料！', 'error');
      return;
    }
    const data = JSON.parse(saved);
    Object.keys(data).forEach(key => {
      const field = document.getElementsByName(key)[0];
      if (field) {
        if (field.type === 'checkbox') {
          const checkboxes = document.getElementsByName(key);
          checkboxes.forEach(cb => {
            cb.checked = Array.isArray(data[key]) && data[key].includes(cb.value);
          });
        } else {
          field.value = data[key];
        }
      }
    });
    showStatus('已成功載入暫存資料！', 'success');
  });

  // 3. 純前端標楷體 PDF 引擎 (標題描邊 2.0 顯著粗體，無編號段落全行縮排 32pt)
  async function generatePDFBlob(data) {
    const { PDFDocument, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    pdfDoc.registerFontkit(fontkit);

    if (!cachedFontBytes) {
      showStatus('載入標楷體字型檔 (kaiu.ttf)...', 'info');
      const fontResponse = await fetch('./kaiu.ttf');
      if (!fontResponse.ok) throw new Error('無法載入 kaiu.ttf 字型檔');
      cachedFontBytes = await fontResponse.arrayBuffer();
    }

    const kaiFont = await pdfDoc.embedFont(cachedFontBytes);
    let currentPage = pdfDoc.addPage([595.28, 841.89]); // A4 尺寸
    const { width, height } = currentPage.getSize();

    const marginX = 40;
    const marginTop = 35;
    const pageBottomMargin = 40; // 40pt 安全觸發門檻
    const printableWidth = width - (marginX * 2); // 515.28 pt

    // 格式化勾選選項文字 (原生 ■ 與 □)
    function formatOptionText(label, isChecked) {
      return (isChecked ? '■ ' : '□ ') + label;
    }

    // 計算字串寬度輔助函式
    function measureTextWidth(text, size) {
      return kaiFont.widthOfTextAtSize(text, size);
    }

    // 繪製向量粗體文字 (Vector Bold Effect)
    function drawBoldText(pageObj, text, x, y, size, strokeWidth = 2.0) {
      pageObj.drawText(text, {
        x: x,
        y: y,
        size: size,
        font: kaiFont,
        color: rgb(0, 0, 0),
        strokeColor: rgb(0, 0, 0),
        strokeWidth: strokeWidth
      });
    }

    // 多階層公務動態縮排解析器
    function processSection(title, contentText, fontSize, maxW) {
      const items = [];
      // 1. 章節大標題 (頂格 0 pt，粗體)
      items.push({ text: title, isTitle: true, indent: 0 });

      // 2. 內文段落階層解析
      const paragraphs = (contentText || '').split('\n');
      for (const para of paragraphs) {
        if (!para.trim()) continue;

        const trimmed = para.trim();
        let baseIndent = 32; // 一般段落首行縮排 2 字 (32pt)
        let hangIndent = 32; // 一般無編號段落：全部內文採縮排 2 字 (32pt)

        // 第四層: (1), （1） -> 首行縮排 5 字 (80pt), 次行懸掛 90pt
        if (/^[\(\（]\d+[\)\）]/.test(trimmed)) {
          baseIndent = 80;
          hangIndent = 90;
        }
        // 第三層: 1., 2., １、, ２、 -> 首行縮排 4 字 (64pt), 次行懸掛 80pt
        else if (/^\d+[\.\、]|^[１２３４５６７８９０]+[\.\、]/.test(trimmed)) {
          baseIndent = 64;
          hangIndent = 80;
        }
        // 第二層: (一), （一） -> 首行縮排 3 字 (48pt), 次行懸掛 80pt
        else if (/^[\(\（][一二三四五六七八九十]+[\)\）]/.test(trimmed)) {
          baseIndent = 48;
          hangIndent = 80;
        }
        // 第一層: 一、, 二、 -> 首行縮排 2 字 (32pt), 次行懸掛 64pt
        else if (/^[一二三四五六七八九十]+\s*[\u3001\uFF0C\.\s]/.test(trimmed)) {
          baseIndent = 32;
          hangIndent = 64;
        }

        let currentLine = '';
        let isFirstLine = true;

        for (const char of para) {
          const currentIndent = isFirstLine ? baseIndent : hangIndent;
          const currentMaxW = maxW - currentIndent;
          const testLine = currentLine + char;

          if (measureTextWidth(testLine, fontSize) > currentMaxW && currentLine !== '') {
            items.push({ text: currentLine, isTitle: false, indent: currentIndent });
            currentLine = char;
            isFirstLine = false;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine !== '') {
          const currentIndent = isFirstLine ? baseIndent : hangIndent;
          items.push({ text: currentLine, isTitle: false, indent: currentIndent });
        }
      }
      return items;
    }

    // ====================================================
    // 1. 頁首與會議性質區塊 (第一頁，14pt 選項 + strokeWidth 2.0 顯著粗體標題)
    // ====================================================
    const listTopY = height - marginTop; // 806.89 pt
    const optionLineSpacing = 20; // 14pt 選項間距

    const types = [
      '部次長交辦事項',
      '重要業務',
      '重要會議結論',
      '首長訪視行程',
      '媒體受訪',
      '其他'
    ];

    // 中間一欄式 6 個勾選選項 (字體 14pt)
    const middleX = marginX + 175;
    types.forEach((t, idx) => {
      const isChecked = (data.meeting_type === t);
      const str = formatOptionText(t, isChecked);
      currentPage.drawText(str, {
        x: middleX,
        y: listTopY - (idx * optionLineSpacing),
        size: 14,
        font: kaiFont
      });
    });

    // 左側：經濟部水利署 (strokeWidth: 2.0 顯著粗體 20pt)
    drawBoldText(currentPage, '經濟部水利署', marginX, listTopY - (2 * optionLineSpacing), 20, 2.0);

    // 右側：辦理現況速報單 (strokeWidth: 2.0 顯著粗體 20pt)
    const rightTitle = '辦理現況速報單';
    const rightTitleW = measureTextWidth(rightTitle, 20);
    drawBoldText(currentPage, rightTitle, marginX + printableWidth - rightTitleW, listTopY - (2 * optionLineSpacing), 20, 2.0);

    // ====================================================
    // 2. 基本資料區 (置於 14pt 第 6 個選項下方)
    // ====================================================
    const basicInfoStartY = listTopY - (6 * optionLineSpacing) - 12;

    // 第一列：交辦長官 / 交辦日期
    currentPage.drawText(`交辦長官：${data.assigner || ''}`, {
      x: marginX,
      y: basicInfoStartY,
      size: 15,
      font: kaiFont
    });
    currentPage.drawText(`交辦日期：${formatROCDate(data.assigned_date)}`, {
      x: marginX + 325,
      y: basicInfoStartY,
      size: 15,
      font: kaiFont
    });

    // 第二列：陳報單位 / 陳報日期
    currentPage.drawText(`陳報單位：${data.reporting_unit || ''}`, {
      x: marginX,
      y: basicInfoStartY - 22,
      size: 15,
      font: kaiFont
    });
    currentPage.drawText(`陳報日期：${formatROCDate(data.report_date)}`, {
      x: marginX + 325,
      y: basicInfoStartY - 22,
      size: 15,
      font: kaiFont
    });

    // 實體表格外框頂端 Y 座標
    let currentPageBoxStartY = basicInfoStartY - 22 - 14;

    // ====================================================
    // 3. 實體表格內文區 (章節大標題獨立 strokeWidth: 2.0 粗體、內文常規字型)
    // ====================================================
    const textPaddingX = 10;
    const maxTextW = printableWidth - (textPaddingX * 2);
    const fontSize = 16;
    const fontLeading = 22;

    const allSections = [
      processSection('壹、案由：', data.section_1, fontSize, maxTextW),
      processSection('貳、重點說明暨續辦摘要：', data.section_2, fontSize, maxTextW),
      processSection('叁、擬處理意見或建議事項：', data.section_3, fontSize, maxTextW)
    ];

    let renderY = currentPageBoxStartY - 24;

    allSections.forEach(sectionItems => {
      sectionItems.forEach(item => {
        // 觸發門檻 40 pt 跨頁偵測
        if (renderY - fontLeading < pageBottomMargin) {
          // 1. 繪製並封閉當前頁面的表格大框線
          const currentBoxH = currentPageBoxStartY - (renderY + 6);
          currentPage.drawRectangle({
            x: marginX,
            y: renderY + 6,
            width: printableWidth,
            height: currentBoxH,
            borderColor: rgb(0, 0, 0),
            borderWidth: 1
          });

          // 2. 自動開啟全新頁面並重設頂部框線座標
          currentPage = pdfDoc.addPage([595.28, 841.89]);
          currentPageBoxStartY = height - marginTop - 10;
          renderY = currentPageBoxStartY - 24;
        }

        // 繪製文字 (章節大標題採用 strokeWidth: 2.0 獨立顯著粗體，內文維持常規)
        if (item.isTitle) {
          drawBoldText(currentPage, item.text, marginX + textPaddingX + item.indent, renderY, fontSize, 2.0);
        } else {
          currentPage.drawText(item.text, {
            x: marginX + textPaddingX + item.indent,
            y: renderY,
            size: fontSize,
            font: kaiFont
          });
        }
        renderY -= fontLeading;
      });
      renderY -= 6;
    });

    // 繪製最後一頁的表格大框線
    const finalBoxEndY = renderY + 6;
    const finalBoxH = currentPageBoxStartY - finalBoxEndY;
    currentPage.drawRectangle({
      x: marginX,
      y: finalBoxEndY,
      width: printableWidth,
      height: finalBoxH,
      borderColor: rgb(0, 0, 0),
      borderWidth: 1
    });

    let currentY = finalBoxEndY - 20;

    // ====================================================
    // 4. 本件分送與聯絡資訊 (偵測剩餘空間，不足時自動開新頁)
    // ====================================================
    if (currentY - 110 < pageBottomMargin) {
      currentPage = pdfDoc.addPage([595.28, 841.89]);
      currentY = height - marginTop - 20;
    }

    const dispatchUnits = Array.isArray(data.dispatch_units) ? data.dispatch_units : [data.dispatch_units].filter(Boolean);

    // 標題
    currentPage.drawText('本件分送（勾選）', {
      x: marginX,
      y: currentY,
      size: 12,
      font: kaiFont
    });

    // 固定 3 欄 X 軸縱向點位對齊
    const colX1 = marginX + 105;
    const colX2 = marginX + 225;
    const colX3 = marginX + 345;

    // 第一列: 署長辦公室, 王副署長辦公室, 黃副署長辦公室
    const row1List = [
      { name: '署長辦公室', x: colX1 },
      { name: '王副署長辦公室', x: colX2 },
      { name: '黃副署長辦公室', x: colX3 }
    ];
    row1List.forEach(item => {
      const isChecked = dispatchUnits.includes(item.name);
      const str = formatOptionText(item.name, isChecked);
      currentPage.drawText(str, {
        x: item.x,
        y: currentY,
        size: 12,
        font: kaiFont
      });
    });

    currentY -= 20;

    // 第二列: 陳副署長辦公室, 總工程司室, 主任秘書室
    const row2List = [
      { name: '陳副署長辦公室', x: colX1 },
      { name: '總工程司室', x: colX2 },
      { name: '主任秘書室', x: colX3 }
    ];
    row2List.forEach(item => {
      const isChecked = dispatchUnits.includes(item.name);
      const str = formatOptionText(item.name, isChecked);
      currentPage.drawText(str, {
        x: item.x,
        y: currentY,
        size: 12,
        font: kaiFont
      });
    });

    currentY -= 20;

    // 第三列: 其他單位
    const hasOther = Boolean(data.other_unit_text && data.other_unit_text.trim());
    const otherBoxStr = formatOptionText('其他單位：', hasOther);
    currentPage.drawText(otherBoxStr, {
      x: colX1,
      y: currentY,
      size: 12,
      font: kaiFont
    });

    if (data.other_unit_text) {
      const prefixW = measureTextWidth(otherBoxStr, 12);
      currentPage.drawText(data.other_unit_text, {
        x: colX1 + prefixW + 2,
        y: currentY,
        size: 12,
        font: kaiFont
      });
    }

    currentY -= 24;

    // 聯絡資訊區
    currentPage.drawText(`本案聯絡人：${data.contact_person || ''}`, {
      x: marginX,
      y: currentY,
      size: 12,
      font: kaiFont
    });

    currentPage.drawText(`聯絡電話：${data.contact_phone || ''}`, {
      x: marginX + 260,
      y: currentY,
      size: 12,
      font: kaiFont
    });

    const pdfBytes = await pdfDoc.save();
    return new Blob([pdfBytes], { type: 'application/pdf' });
  }

  // 匯出 PDF 檔
  document.getElementById('btnExportPDF').addEventListener('click', async () => {
    try {
      showStatus('正在生成最新正式版 PDF...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(pdfBlob);
      link.download = `速報單_${data.report_date || ''}.pdf`;
      link.click();
      showStatus('PDF 匯出成功！版面已完成正式上線優化。', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });

  // 匯出雙軌/Word 包
  document.getElementById('btnExportWord').addEventListener('click', async () => {
    try {
      showStatus('正在打包檔案...', 'info');
      const data = getFormData();
      const pdfBlob = await generatePDFBlob(data);
      const zip = new JSZip();
      zip.file(`速報單_${data.report_date}.pdf`, pdfBlob);
      zip.file(`速報單內容.json`, JSON.stringify(data, null, 2));
      const zipContent = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipContent);
      link.download = `速報單檔案包_${data.report_date}.zip`;
      link.click();
      showStatus('檔案包匯出成功！', 'success');
    } catch (err) {
      showStatus(`匯出失敗: ${err.message}`, 'error');
    }
  });
</script>
</body>
</html>
