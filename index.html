<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打工雲 - 公務速報與預算工具箱</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66bab7">

  <style>
    :root {
      --primary-teal: rgb(102, 186, 183);
      --primary-dark: #2c8582;
      --primary-light: #f0f8f8;
      --bg-gradient: linear-gradient(180deg, #e6f4f4 0%, #f4fbfb 100%);
      --card-bg: #ffffff;
      --border-color: #e2eceb;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --radius-card: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* 頂部 Header 卡片 */
    .hero-card {
      background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 100%);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 20px -5px rgba(102, 186, 183, 0.4);
      margin-bottom: 20px;
      position: relative;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hero-icon {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-lock:active {
      background: rgba(0, 0, 0, 0.2);
    }

    /* 選單列表卡片 */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-item {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .menu-item:active {
      transform: scale(0.98);
      background: var(--primary-light);
      border-color: var(--primary-teal);
    }

    .menu-item-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.01em;
    }

    .menu-item-icon {
      width: 44px;
      height: 44px;
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-dark);
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* 頁尾文字 */
    .footer-text {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* 🔐 密碼驗證遮罩 Modal */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .auth-card-icon {
      width: 64px;
      height: 64px;
      background: #e6f4f4;
      color: var(--primary-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px auto;
    }

    .auth-card-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .auth-card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .auth-input {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      text-align: center;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    .auth-input:focus {
      border-color: var(--primary-teal);
      box-shadow: 0 0 0 4px rgba(102, 186, 183, 0.2);
    }

    .btn-auth-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2c8582 0%, rgb(102, 186, 183) 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 186, 183, 0.35);
      transition: all 0.2s ease;
    }

    .btn-auth-submit:active {
      transform: scale(0.97);
    }

    .auth-error-msg {
      margin-top: 12px;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: bold;
      min-height: 20px;
    }

    /* 震動效果 */
    .shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<!-- 🔐 密碼驗證遮罩 Modal -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card" id="authCard">
    <div class="auth-card-icon">🔐</div>
    <div class="auth-card-title" id="authTargetTitle">進入工作區驗證</div>
    <div class="auth-card-desc">請輸入今日工作區通行密碼</div>
    <input type="password" id="authPasswordInput" class="auth-input" placeholder="例如：wra@1009" autocomplete="off" onkeyup="handleKeyUp(event)">
    <button type="button" class="btn-auth-submit" onclick="verifyAndNavigate()">解鎖並進入</button>
    <div id="authErrorMsg" class="auth-error-msg"></div>
  </div>
</div>

<div class="container">
  <!-- 頂部 Header 卡片 -->
  <div class="hero-card">
    <div class="hero-left">
      <div class="hero-icon">👤</div>
      <div class="hero-title">打工雲</div>
    </div>
    <button type="button" class="btn-lock" onclick="lockSystem()" title="重新鎖定系統">🔒 鎖定</button>
  </div>

  <!-- 選單列表 -->
  <div class="menu-list">
    <div class="menu-item" onclick="openWorkspace('./wra-report.html', '水利署速報單')">
      <span class="menu-item-title">水利署速報單</span>
      <div class="menu-item-icon">➔</div>
    </div>

    <div class="menu-item" onclick="openWorkspace('./moea-report.html', '經濟部速報單')">
      <span class="menu-item-title">經濟部速報單</span>
      <div class="menu-item-icon">➔</div>
    </div>

    <div class="menu-item" onclick="openWorkspace('./budget.html', '計畫年度預算')">
      <span class="menu-item-title">計畫年度預算</span>
      <div class="menu-item-icon">➔</div>
    </div>
  </div>

  <!-- 頁尾 -->
  <div class="footer-text">
    水利監製 v6.6
  </div>
</div>

<script>
  let targetWorkspaceUrl = '';

  // PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js?v=6.6')
        .then(reg => console.log('Portal Service Worker v6.6 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗:', err));
    });
  }

  // 自動計算當天日期動態密碼 (格式：wra@MMDD 或 war@MMDD)
  function getValidPasswords() {
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const dateStr = `${month}${day}`;
    return [
      `wra@${dateStr}`,
      `war@${dateStr}`
    ];
  }

  // 取得今天的日期字串 (YYYY-MM-DD) 作為 session 鎖定依據
  function getTodayString() {
    const now = new Date();
    return `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
  }

  // 檢查當天是否已完成驗證
  function isAlreadyAuthenticated() {
    const savedAuthDate = sessionStorage.getItem('dagong_auth_date');
    return savedAuthDate === getTodayString();
  }

  // 點擊工作區卡片入口觸發
  function openWorkspace(url, title) {
    targetWorkspaceUrl = url;

    // 若今日已通過驗證，直接進入工作區
    if (isAlreadyAuthenticated()) {
      window.location.href = targetWorkspaceUrl;
      return;
    }

    // 否則跳出密碼驗證視窗
    document.getElementById('authTargetTitle').innerText = title;
    document.getElementById('authErrorMsg').innerText = '';
    const passInput = document.getElementById('authPasswordInput');
    passInput.value = '';
    
    const overlay = document.getElementById('authOverlay');
    overlay.style.display = 'flex';
    setTimeout(() => passInput.focus(), 200);
  }

  // 驗證密碼邏輯
  function verifyAndNavigate() {
    const passInput = document.getElementById('authPasswordInput');
    const errorMsg = document.getElementById('authErrorMsg');
    const authCard = document.getElementById('authCard');
    
    const inputVal = (passInput.value || '').trim().toLowerCase();
    const validPasses = getValidPasswords().map(p => p.toLowerCase());

    if (validPasses.includes(inputVal)) {
      // 標記今日已成功驗證
      sessionStorage.setItem('dagong_auth_date', getTodayString());
      errorMsg.innerText = '';
      
      // 順暢進入目標工作區
      if (targetWorkspaceUrl) {
        window.location.href = targetWorkspaceUrl;
      } else {
        document.getElementById('authOverlay').style.display = 'none';
      }
    } else {
      errorMsg.innerText = '❌ 密碼錯誤！今日密碼為 wra@當天日期';
      passInput.value = '';
      passInput.focus();
      
      // 觸發震動提醒
      authCard.classList.remove('shake');
      void authCard.offsetWidth; // 強制重繪
      authCard.classList.add('shake');
    }
  }

  // 支援 Enter 鍵快捷送出
  function handleKeyUp(event) {
    if (event.key === 'Enter') {
      verifyAndNavigate();
    }
  }

  // 手動重新鎖定系統
  function lockSystem() {
    sessionStorage.removeItem('dagong_auth_date');
    alert('🔒 已成功重新鎖定系統！進入工作區需再次輸入密碼。');
  }
</script>

</body>
</html>
